<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17142b"><link rel="manifest" href="./manifest.json"><title>Retro Collection</title>
<style>
:root{--bg:#100f20;--panel:#1b1932;--panel2:#242141;--text:#fffaff;--muted:#bcb8d3;--accent:#a78bfa;--accent2:#5eead4;--border:#383354;--pink:#fb7185;--gold:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#3b2868 0,transparent 48%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:850px;margin:auto;padding:env(safe-area-inset-top) 15px 110px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 3px 17px}.logo{font-weight:950;font-size:21px;letter-spacing:.7px}.logo span{color:var(--accent2)}header>button{width:43px;height:43px;border:1px solid #62528d;border-radius:15px;background:linear-gradient(145deg,#a78bfa,#7c3aed);font-size:25px;box-shadow:0 6px 18px #8b5cf644}
.hero,.card{background:linear-gradient(145deg,#211e3b,#19172e);border:1px solid var(--border);border-radius:22px;padding:17px;margin-bottom:13px;box-shadow:0 10px 28px #08071644}.hero h1{font-size:25px;margin:2px 0 5px;letter-spacing:-.5px}.hero h2,.modal h2{margin:4px 0 8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0}.stat{background:linear-gradient(145deg,#151329,#1b1931);border:1px solid #393352;padding:11px 9px;border-radius:15px;min-width:0}.stat b{display:block;font-size:18px;overflow-wrap:anywhere;color:#fff}.stat span,.hint,.meta{font-size:12px;color:var(--muted)}.stat span{display:block;margin-top:3px}.primary{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(100deg,#9b7afa,#7655df);font-weight:800;box-shadow:0 7px 20px #8b5cf633;transition:transform .15s}.primary:active,button:active{transform:scale(.98)}
.toolbar{display:flex;gap:8px;margin:15px 0 13px}.toolbar input{flex:1;min-width:0}.toolbar select{width:135px}input,select,textarea{background:#121126;color:var(--text);border:1px solid #3b365a;padding:12px;border-radius:13px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a78bfa22}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{padding:0;overflow:hidden;margin:0;transition:transform .15s,border-color .15s}.card:active{transform:scale(.985)}.thumb{width:100%;aspect-ratio:1;object-fit:cover;background:linear-gradient(135deg,#302a4c,#17152b);display:block}.cardbody{padding:11px}.title{font-weight:800;line-height:1.3}.meta{margin-top:5px}.tag{display:inline-block;font-size:10px;color:#d9d3ff;background:#39325a;padding:6px 8px;border-radius:8px;margin-top:7px}.price{font-weight:850;margin-top:8px;color:var(--accent2)}.empty{text-align:center;padding:34px 20px;color:var(--muted);border:1px dashed #51496f;border-radius:18px;background:#1b193255}.sectionTitle{font-size:20px;font-weight:850;margin:19px 2px 12px}
nav{position:fixed;z-index:5;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(95%,550px);display:grid;grid-template-columns:repeat(4,1fr);background:#201e36f5;backdrop-filter:blur(18px);border:1px solid #494268;border-radius:20px;padding:6px;box-shadow:0 10px 35px #0008}nav button{border:0;background:transparent;color:#bcb8d3;font-size:11px;font-weight:650;padding:8px 2px;border-radius:14px}nav button.active{background:linear-gradient(145deg,#514078,#342c58);color:white}nav span{display:block;font-size:19px;margin-bottom:3px}
dialog{width:min(94%,600px);max-height:90vh;background:var(--panel);color:var(--text);border:1px solid #4a426b;border-radius:22px;padding:0;box-shadow:0 20px 70px #0009}dialog::backdrop{background:#080611c9;backdrop-filter:blur(4px)}.modal{padding:17px;max-height:90vh;overflow:auto}.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.actions button{flex:1;min-width:105px;background:#302c4b;border:1px solid #484165;padding:12px 10px;border-radius:13px;font-weight:700;font-size:13px}.actions .ok{background:linear-gradient(100deg,#9b7afa,#7655df);border-color:transparent}.actions .vinted{background:#147a52;border-color:#26996d}.actions .ebay{background:#f6d34a;color:#24202e;border-color:#f6d34a}.preview{max-width:100%;max-height:240px;display:block;margin:10px auto;border-radius:15px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#302c4b;border:1px solid #554a7b;padding:11px 16px;border-radius:13px;z-index:9;box-shadow:0 8px 25px #0007;max-width:90%;text-align:center}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.app{padding-left:20px;padding-right:20px}}
@media(max-width:370px){.toolbar select{width:112px}.stats{gap:6px}.stat{padding:9px 7px}.stat b{font-size:16px}}
</style></head><body><div id="app"></div><div id="toast" class="toast" hidden></div>
<nav id="nav"><button class="active" data-page="collection"><span>🎮</span>Collection</button><button data-page="stats"><span>📊</span>Stats</button><button data-page="backup"><span>💾</span>Sauvegarde</button><button data-page="settings"><span>⚙️</span>Réglages</button></nav>
<dialog id="photoDialog"><div class="modal"><h2>Ajouter un jeu 🎮</h2><p class="hint">Choisis une photo ou saisis les informations.</p><div class="actions"><button onclick="$('#cam').click()">📷 Appareil photo</button><button onclick="$('#gal').click()">🖼️ Galerie</button><button onclick="manualAdd()">✏️ Saisie manuelle</button></div><input id="cam" type="file" accept="image/*" capture="environment" hidden><input id="gal" type="file" accept="image/*" hidden><div id="photoWrap"></div><div class="actions"><button onclick="photoDialog.close()">Fermer</button></div></div></dialog>
<dialog id="editDialog"><div class="modal" id="editModal"></div></dialog><input id="importFile" type="file" accept="application/json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s), DB='retro_collection_db',STORE='games';
const platforms=['Nintendo','Super Nintendo','Nintendo 64','Game Boy','Game Boy Color','Game Boy Advance','DS','3DS','NES','Wii','Wii U','PlayStation','PlayStation 2','PlayStation 3','PlayStation 4','PlayStation 5','PSP','Xbox','Xbox 360','Xbox One','Xbox Series','Mega Drive','Master System','Dreamcast','Saturn','PC','Autre'],conditions=['Cartouche/disque seul','Complet avec boîte','Complet + notice/accessoires','Scellé','Autre'];
let db,games=[],page='collection',photo='',editing=null;const photoDialog=$('#photoDialog'),editDialog=$('#editDialog');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.hidden=false;setTimeout(()=>t.hidden=true,2500)}
function eur(n){return n!==''&&n!=null?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n)||0):'Prix inconnu'}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function getAll(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(g){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(g);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function del(id){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function refresh(){games=await getAll();render()}
function head(){return '<header><div class="logo">RETRO <span>COLLECTION ✦</span></div><button aria-label="Ajouter un jeu" onclick="openAdd()">＋</button></header>'}
function collection(){let q=window.q||'',p=window.p||'Tous',a=games.filter(g=>(!q||[g.title,g.platform,g.edition].join(' ').toLowerCase().includes(q.toLowerCase()))&&(p==='Tous'||g.platform===p));let count=games.reduce((n,g)=>n+(+g.quantity||1),0),val=games.reduce((n,g)=>n+(+g.price||0)*(+g.quantity||1),0);return `<main class="app">${head()}<section class="hero"><h1>Ma collection 🕹️</h1><p class="hint">Tous tes trésors rétro réunis au même endroit.</p><div class="stats"><div class="stat"><b>${games.length}</b><span>🎮 Jeux</span></div><div class="stat"><b>${count}</b><span>📦 Exemplaires</span></div><div class="stat"><b>${eur(val)}</b><span>💎 Valeur connue</span></div></div><button class="primary" onclick="openAdd()">📸 Ajouter un jeu</button></section><div class="toolbar"><input id="search" placeholder="🔎 Rechercher un jeu…" value="${esc(q)}"><select id="filter"><option>Toutes consoles</option>${platforms.map(x=>`<option ${p===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<div class="empty">🎮<br><b>Ta collection commence ici !</b><br><span class="hint">Ajoute ton premier jeu avec le bouton ci-dessus.</span></div>'}</main>`}
function card(g){return `<article class="card" onclick="editGame('${esc(g.id)}')">${g.image?`<img class="thumb" src="${g.image}" alt="">`:'<div class="thumb"></div>'}<div class="cardbody"><div class="title">${esc(g.title||'Jeu sans titre')}</div><div class="meta">${esc(g.platform||'Console inconnue')}</div><span class="tag">${esc(g.condition||'État non renseigné')} · x${g.quantity||1}</span><div class="price">${g.price!==''&&g.price!=null?eur(g.price*(g.quantity||1)):'Prix inconnu'}</div></div></article>`}
function stats(){let n=games.reduce((a,g)=>a+(+g.quantity||1),0),v=games.reduce((a,g)=>a+(+g.price||0)*(+g.quantity||1),0),by={};games.forEach(g=>by[g.platform||'Inconnue']=(by[g.platform||'Inconnue']||0)+(+g.quantity||1));return `<main class="app">${head()}<h2 class="sectionTitle">📊 Tes statistiques</h2><section class="hero"><div class="stats"><div class="stat"><b>${games.length}</b><span>🎮 Jeux</span></div><div class="stat"><b>${n}</b><span>📦 Exemplaires</span></div><div class="stat"><b>${eur(v)}</b><span>💎 Valeur connue</span></div></div><p class="hint">${games.filter(g=>g.price!==''&&g.price!=null).length} jeu(x) avec prix renseigné.</p></section><h3>🧩 Par plateforme</h3>${Object.entries(by).map(([k,v])=>`<div class="hero">${esc(k)} — ${v}</div>`).join('')||'<div class="empty">Pas encore de données.</div>'}</main>`}
function backup(){return `<main class="app">${head()}<h2 class="sectionTitle">💾 Sauvegarde</h2><section class="hero"><p class="hint">Garde une copie de ta collection et de tes photos en sécurité.</p><div class="actions"><button class="ok" onclick="exportData()">📤 Exporter ma collection</button><button onclick="$('#importFile').click()">📥 Importer une sauvegarde</button></div></section></main>`}
function settings(){return `<main class="app">${head()}<h2 class="sectionTitle">⚙️ Réglages</h2><section class="hero"><h3>🤖 Reconnaissance IA</h3><p class="hint">Adresse du Worker Cloudflare. La clé OpenAI reste côté serveur.</p><div class="field"><label>URL du Worker</label><input id="workerUrl" value="${esc(localStorage.getItem('retro_api_url')||'')}" placeholder="https://nom.workers.dev"></div><div class="actions"><button class="ok" onclick="saveUrl()">Enregistrer</button><button onclick="testUrl()">Tester la connexion</button></div><p id="status" class="hint"></p></section></main>`}
function render(){let a=$('#app');a.innerHTML=page==='collection'?collection():page==='stats'?stats():page==='backup'?backup():settings();if(page==='collection'){let s=$('#search');s.oninput=()=>{let v=s.value,pos=s.selectionStart;window.q=v;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#filter').onchange=e=>{let v=e.target.value;window.p=v==='Toutes consoles'?'Tous':v;render()}}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function openAdd(){photo='';$('#photoWrap').innerHTML='';photoDialog.showModal()}
function manualAdd(){photoDialog.close();openEditor({})}
function resize(file){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let i=new Image();i.onerror=no;i.onload=()=>{let s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(file)})}
async function gotFile(f){if(!f)return;try{photo=await resize(f);$('#photoWrap').innerHTML=`<img class="preview" src="${photo}"><div class="actions"><button class="ok" onclick="recognize()">🤖 Reconnaître avec OpenAI</button><button onclick="manualAdd()">✏️ Saisie manuelle</button></div>`}catch(e){toast('Lecture photo impossible')}}
$('#cam').onchange=e=>gotFile(e.target.files[0]);$('#gal').onchange=e=>gotFile(e.target.files[0]);
async function recognize(){let url=localStorage.getItem('retro_api_url');if(!url){toast('Configure l’URL du Worker dans Réglages');return}$('#photoWrap').insertAdjacentHTML('beforeend','<p id="busy" class="hint">Analyse en cours…</p>');try{let c=new AbortController(),tm=setTimeout(()=>c.abort(),60000),r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:photo}),signal:c.signal});clearTimeout(tm);let txt=await r.text(),d;try{d=JSON.parse(txt)}catch{throw Error('Réponse illisible : '+txt.slice(0,100))}if(!r.ok)throw Error(d.error||'Erreur HTTP '+r.status);if(!d.title&&!d.platform)throw Error('Aucune identification reçue');photoDialog.close();openEditor({...d,image:photo})}catch(e){$('#busy')?.remove();$('#photoWrap').insertAdjacentHTML('beforeend',`<p class="hint">❌ ${esc(e.name==='AbortError'?'Délai dépassé':e.message)}</p>`)}}
function openEditor(g){editing=g.id||null;$('#editModal').innerHTML=`<h2>${editing?'✏️ Modifier le jeu':'✨ Vérifie les informations'}</h2>${g.image?`<img class="preview" src="${g.image}">`:''}<div class="field"><label>Titre</label><input id="title" value="${esc(g.title||'')}"></div><div class="row"><div class="field"><label>Plateforme</label><input id="platform" list="plist" value="${esc(g.platform||'')}"><datalist id="plist">${platforms.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field"><label>Année</label><input id="year" type="number" value="${esc(g.year||'')}"></div></div><div class="field"><label>Édition</label><input id="edition" value="${esc(g.edition||'')}"></div><div class="field"><label>État</label><select id="condition">${conditions.map(x=>`<option ${g.condition===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Quantité</label><input id="qty" type="number" min="1" value="${g.quantity||1}"></div><div class="field"><label>Prix estimé (€) — saisie manuelle</label><input id="price" type="number" min="0" step=".01" value="${g.price??''}"></div></div><div class="field"><label>Date estimation</label><input id="date" type="date" value="${esc(g.priceDate||'')}"></div><div class="field"><label>Notes</label><textarea id="notes">${esc(g.notes||'')}</textarea></div><div class="actions"><button onclick="editDialog.close()">Annuler</button><button class="vinted" onclick="vinted()">🟢 Vinted</button><button class="ebay" onclick="ebay()">🟡 eBay France</button><button class="ok" onclick="saveGame()">💾 Enregistrer</button>${editing?'<button onclick="removeGame()">🗑️ Supprimer</button>':''}</div>`;editDialog.showModal();window.editImage=g.image||photo}
async function saveGame(){let old=games.find(g=>g.id===editing),g={id:editing||crypto.randomUUID(),image:old?.image||window.editImage||'',title:$('#title').value.trim(),platform:$('#platform').value.trim(),year:$('#year').value,edition:$('#edition').value.trim(),condition:$('#condition').value,quantity:Math.max(1,+$('#qty').value||1),price:$('#price').value===''?'':+$('#price').value,priceDate:$('#date').value,notes:$('#notes').value.trim()};await put(g);editDialog.close();photo='';await refresh();toast('Jeu enregistré')}
function editGame(id){let g=games.find(x=>x.id===id);if(g)openEditor(g)}
async function removeGame(){if(editing&&confirm('Supprimer ce jeu ?')){await del(editing);editDialog.close();await refresh();toast('Jeu supprimé')}}
function searchTerms(){return [$('#title').value,$('#platform').value,$('#edition').value].map(x=>x.trim()).filter(Boolean).join(' ')}
function vinted(){let q=searchTerms();if(!q){toast('Saisis au moins le titre du jeu');return}window.open('https://www.vinted.fr/catalog?search_text='+encodeURIComponent(q),'_blank')}
function ebay(){let q=searchTerms();if(!q){toast('Saisis au moins le titre du jeu');return}window.open('https://www.ebay.fr/sch/i.html?_nkw='+encodeURIComponent(q),'_blank')}
function saveUrl(){localStorage.setItem('retro_api_url',$('#workerUrl').value.trim().replace(/\/+$/,''));toast('URL enregistrée')}
async function testUrl(){let u=$('#workerUrl').value.trim(),s=$('#status');if(!u){s.textContent='Saisis l’URL du Worker.';return}s.textContent='Test…';try{let r=await fetch(u),t=await r.text();s.textContent='HTTP '+r.status+' — '+t.slice(0,130)}catch(e){s.textContent='Échec : '+e.message}}
function exportData(){let blob=new Blob([JSON.stringify({app:'Retro Collection',version:1,games})],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='retro-collection.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.games))throw Error('Fichier invalide');if(!confirm('Remplacer la collection actuelle ?'))return;for(let g of games)await del(g.id);for(let g of d.games)if(g.id)await put(g);await refresh();toast('Import terminé')}catch(x){toast('Import impossible : '+x.message)}e.target.value=''};
(async()=>{try{await openDB();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#app').innerHTML='<main class="app">Erreur de stockage local. Recharge Safari.</main>'}})();
</script></body></html>

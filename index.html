<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090e"><link rel="manifest" href="./manifest.json"><title>Retro Collection</title>
<style>
:root{--bg:#09090e;--panel:#15151f;--text:#f5f5fa;--muted:#aaaaba;--accent:#8b5cf6;--border:#30303e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:850px;margin:auto;padding:env(safe-area-inset-top) 14px 105px}header{display:flex;justify-content:space-between;align-items:center;padding:18px 3px}.logo{font-weight:900;font-size:22px}.logo span{color:#22d3ee}.hero,.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#0e0e15;border:1px solid var(--border);padding:10px;border-radius:12px;min-width:0}.stat b{display:block;font-size:18px;overflow-wrap:anywhere}.stat span,.hint,.meta{font-size:12px;color:var(--muted)}button.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);font-weight:bold}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar input{flex:1;min-width:0}.toolbar select{width:135px}input,select,textarea{background:#0e0e15;color:var(--text);border:1px solid var(--border);padding:11px;border-radius:11px;width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:0;overflow:hidden;margin:0}.thumb{width:100%;aspect-ratio:1;object-fit:cover;background:#222}.cardbody{padding:10px}.title{font-weight:bold}.meta{margin-top:5px}.tag{display:inline-block;font-size:11px;background:#252532;padding:5px;border-radius:7px;margin-top:6px}.price{font-weight:bold;margin-top:7px}.empty{text-align:center;padding:30px;color:var(--muted);border:1px dashed var(--border);border-radius:15px}.sectionTitle{font-size:19px;font-weight:bold;margin:18px 2px 10px}nav{position:fixed;z-index:5;bottom:8px;left:50%;transform:translateX(-50%);width:min(95%,550px);display:grid;grid-template-columns:repeat(4,1fr);background:#191923f2;border:1px solid var(--border);border-radius:18px;padding:6px}nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:8px 2px;border-radius:12px}nav button.active{background:#2a2938;color:white}nav span{display:block;font-size:18px}dialog{width:min(94%,600px);max-height:90vh;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:0}dialog::backdrop{background:#000b}.modal{padding:16px;max-height:90vh;overflow:auto}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button{flex:1;min-width:110px;background:#282835;border:1px solid var(--border);padding:11px;border-radius:11px}.actions .ok{background:var(--accent)}.preview{max-width:100%;max-height:240px;display:block;margin:10px auto}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#292938;padding:10px;border-radius:10px;z-index:9}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div><div id="toast" class="toast" hidden></div>
<nav id="nav"><button class="active" data-page="collection"><span>🎮</span>Collection</button><button data-page="stats"><span>📊</span>Stats</button><button data-page="backup"><span>💾</span>Sauvegarde</button><button data-page="settings"><span>⚙️</span>Réglages</button></nav>
<dialog id="photoDialog"><div class="modal"><h2>Ajouter un jeu</h2><p class="hint">Choisis une photo ou saisis les informations.</p><div class="actions"><button onclick="$('#cam').click()">📷 Appareil photo</button><button onclick="$('#gal').click()">🖼️ Galerie</button><button onclick="manualAdd()">Saisie manuelle</button></div><input id="cam" type="file" accept="image/*" capture="environment" hidden><input id="gal" type="file" accept="image/*" hidden><div id="photoWrap"></div><div class="actions"><button onclick="photoDialog.close()">Fermer</button></div></div></dialog>
<dialog id="editDialog"><div class="modal" id="editModal"></div></dialog><input id="importFile" type="file" accept="application/json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s), DB='retro_collection_db',STORE='games';
const platforms=['Nintendo','Super Nintendo','Nintendo 64','Game Boy','Game Boy Color','Game Boy Advance','DS','3DS','NES','Wii','Wii U','PlayStation','PlayStation 2','PlayStation 3','PlayStation 4','PlayStation 5','PSP','Xbox','Xbox 360','Xbox One','Xbox Series','Mega Drive','Master System','Dreamcast','Saturn','PC','Autre'],conditions=['Cartouche/disque seul','Complet avec boîte','Complet + notice/accessoires','Scellé','Autre'];
let db,games=[],page='collection',photo='',editing=null;const photoDialog=$('#photoDialog'),editDialog=$('#editDialog');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.hidden=false;setTimeout(()=>t.hidden=true,2500)}
function eur(n){return n!==''&&n!=null?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n)||0):'Prix inconnu'}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function getAll(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(g){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(g);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function del(id){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function refresh(){games=await getAll();render()}
function head(){return '<header><div class="logo">RETRO <span>COLLECTION</span></div><button onclick="openAdd()">＋</button></header>'}
function collection(){let q=window.q||'',p=window.p||'Tous',a=games.filter(g=>(!q||[g.title,g.platform,g.edition].join(' ').toLowerCase().includes(q.toLowerCase()))&&(p==='Tous'||g.platform===p));let count=games.reduce((n,g)=>n+(+g.quantity||1),0),val=games.reduce((n,g)=>n+(+g.price||0)*(+g.quantity||1),0);return `<main class="app">${head()}<section class="hero"><h1>Ma collection</h1><p class="hint">Tes jeux sont conservés sur cet appareil.</p><div class="stats"><div class="stat"><b>${games.length}</b><span>jeux</span></div><div class="stat"><b>${count}</b><span>exemplaires</span></div><div class="stat"><b>${eur(val)}</b><span>valeur connue</span></div></div><button class="primary" onclick="openAdd()">📸 Ajouter un jeu par photo</button></section><div class="toolbar"><input id="search" placeholder="Rechercher…" value="${esc(q)}"><select id="filter"><option>Tous</option>${platforms.map(x=>`<option ${p===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<div class="empty">Aucun jeu. Ajoute ton premier jeu !</div>'}</main>`}
function card(g){return `<article class="card" onclick="editGame('${esc(g.id)}')">${g.image?`<img class="thumb" src="${g.image}">`:'<div class="thumb"></div>'}<div class="cardbody"><div class="title">${esc(g.title||'Jeu sans titre')}</div><div class="meta">${esc(g.platform||'Console inconnue')}</div><span class="tag">${esc(g.condition||'État non renseigné')} · x${g.quantity||1}</span><div class="price">${g.price!==''&&g.price!=null?eur(g.price*(g.quantity||1)):'Prix inconnu'}</div></div></article>`}
function stats(){let n=games.reduce((a,g)=>a+(+g.quantity||1),0),v=games.reduce((a,g)=>a+(+g.price||0)*(+g.quantity||1),0),by={};games.forEach(g=>by[g.platform||'Inconnue']=(by[g.platform||'Inconnue']||0)+(+g.quantity||1));return `<main class="app">${head()}<h2 class="sectionTitle">Statistiques</h2><section class="hero"><div class="stats"><div class="stat"><b>${games.length}</b><span>jeux</span></div><div class="stat"><b>${n}</b><span>exemplaires</span></div><div class="stat"><b>${eur(v)}</b><span>valeur connue</span></div></div><p class="hint">${games.filter(g=>g.price!==''&&g.price!=null).length} jeu(x) avec prix renseigné.</p></section><h3>Par plateforme</h3>${Object.entries(by).map(([k,v])=>`<div class="hero">${esc(k)} — ${v}</div>`).join('')||'<div class="empty">Pas encore de données.</div>'}</main>`}
function backup(){return `<main class="app">${head()}<h2 class="sectionTitle">Sauvegarde</h2><section class="hero"><p class="hint">Exporte un fichier JSON contenant tes données et les photos.</p><div class="actions"><button class="ok" onclick="exportData()">📤 Exporter</button><button onclick="$('#importFile').click()">📥 Importer</button></div></section></main>`}
function settings(){return `<main class="app">${head()}<h2 class="sectionTitle">Réglages</h2><section class="hero"><h3>Reconnaissance IA</h3><p class="hint">Adresse du Worker Cloudflare. La clé OpenAI reste côté serveur.</p><div class="field"><label>URL du Worker</label><input id="workerUrl" value="${esc(localStorage.getItem('retro_api_url')||'')}" placeholder="https://nom.workers.dev"></div><div class="actions"><button class="ok" onclick="saveUrl()">Enregistrer</button><button onclick="testUrl()">Tester la connexion</button></div><p id="status" class="hint"></p></section></main>`}
function render(){let a=$('#app');a.innerHTML=page==='collection'?collection():page==='stats'?stats():page==='backup'?backup():settings();if(page==='collection'){let s=$('#search');s.oninput=()=>{let v=s.value,pos=s.selectionStart;window.q=v;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#filter').onchange=e=>{window.p=e.target.value;render()}}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function openAdd(){photo='';$('#photoWrap').innerHTML='';photoDialog.showModal()}
function manualAdd(){photoDialog.close();openEditor({})}
function resize(file){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let i=new Image();i.onerror=no;i.onload=()=>{let s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(file)})}
async function gotFile(f){if(!f)return;try{photo=await resize(f);$('#photoWrap').innerHTML=`<img class="preview" src="${photo}"><div class="actions"><button class="ok" onclick="recognize()">🤖 Reconnaître avec OpenAI</button><button onclick="manualAdd()">Saisie manuelle</button></div>`}catch(e){toast('Lecture photo impossible')}}
$('#cam').onchange=e=>gotFile(e.target.files[0]);$('#gal').onchange=e=>gotFile(e.target.files[0]);
async function recognize(){let url=localStorage.getItem('retro_api_url');if(!url){toast('Configure l’URL du Worker dans Réglages');return}$('#photoWrap').insertAdjacentHTML('beforeend','<p id="busy" class="hint">Analyse en cours…</p>');try{let c=new AbortController(),tm=setTimeout(()=>c.abort(),60000),r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:photo}),signal:c.signal});clearTimeout(tm);let txt=await r.text(),d;try{d=JSON.parse(txt)}catch{throw Error('Réponse illisible : '+txt.slice(0,100))}if(!r.ok)throw Error(d.error||'Erreur HTTP '+r.status);if(!d.title&&!d.platform)throw Error('Aucune identification reçue');photoDialog.close();openEditor({...d,image:photo})}catch(e){$('#busy')?.remove();$('#photoWrap').insertAdjacentHTML('beforeend',`<p class="hint">❌ ${esc(e.name==='AbortError'?'Délai dépassé':e.message)}</p>`)}}
function openEditor(g){editing=g.id||null;$('#editModal').innerHTML=`<h2>${editing?'Modifier':'Vérifier'} le jeu</h2>${g.image?`<img class="preview" src="${g.image}">`:''}<div class="field"><label>Titre</label><input id="title" value="${esc(g.title||'')}"></div><div class="row"><div class="field"><label>Plateforme</label><input id="platform" list="plist" value="${esc(g.platform||'')}"><datalist id="plist">${platforms.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field"><label>Année</label><input id="year" type="number" value="${esc(g.year||'')}"></div></div><div class="field"><label>Édition</label><input id="edition" value="${esc(g.edition||'')}"></div><div class="field"><label>État</label><select id="condition">${conditions.map(x=>`<option ${g.condition===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Quantité</label><input id="qty" type="number" min="1" value="${g.quantity||1}"></div><div class="field"><label>Prix estimé (€)</label><input id="price" type="number" min="0" step=".01" value="${g.price??''}"></div></div><div class="field"><label>Date estimation</label><input id="date" type="date" value="${esc(g.priceDate||'')}"></div><div class="field"><label>Notes</label><textarea id="notes">${esc(g.notes||'')}</textarea></div><div class="actions"><button onclick="editDialog.close()">Annuler</button><button onclick="ebay()">🔎 eBay France</button><button class="ok" onclick="saveGame()">Enregistrer</button>${editing?'<button onclick="removeGame()">Supprimer</button>':''}</div>`;editDialog.showModal();window.editImage=g.image||photo}
async function saveGame(){let old=games.find(g=>g.id===editing),g={id:editing||crypto.randomUUID(),image:old?.image||window.editImage||'',title:$('#title').value.trim(),platform:$('#platform').value.trim(),year:$('#year').value,edition:$('#edition').value.trim(),condition:$('#condition').value,quantity:Math.max(1,+$('#qty').value||1),price:$('#price').value===''?'':+$('#price').value,priceDate:$('#date').value,notes:$('#notes').value.trim()};await put(g);editDialog.close();photo='';await refresh();toast('Jeu enregistré')}
function editGame(id){let g=games.find(x=>x.id===id);if(g)openEditor(g)}
async function removeGame(){if(editing&&confirm('Supprimer ce jeu ?')){await del(editing);editDialog.close();await refresh();toast('Jeu supprimé')}}
function ebay(){let q=[$('#title').value,$('#platform').value,$('#edition').value].filter(Boolean).join(' ');window.open('https://www.ebay.fr/sch/i.html?_nkw='+encodeURIComponent(q),'_blank')}
function saveUrl(){localStorage.setItem('retro_api_url',$('#workerUrl').value.trim().replace(/\/+$/,''));toast('URL enregistrée')}
async function testUrl(){let u=$('#workerUrl').value.trim(),s=$('#status');if(!u){s.textContent='Saisis l’URL du Worker.';return}s.textContent='Test…';try{let r=await fetch(u),t=await r.text();s.textContent='HTTP '+r.status+' — '+t.slice(0,130)}catch(e){s.textContent='Échec : '+e.message}}
function exportData(){let blob=new Blob([JSON.stringify({app:'Retro Collection',version:1,games})],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='retro-collection.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.games))throw Error('Fichier invalide');if(!confirm('Remplacer la collection actuelle ?'))return;for(let g of games)await del(g.id);for(let g of d.games)if(g.id)await put(g);await refresh();toast('Import terminé')}catch(x){toast('Import impossible : '+x.message)}e.target.value=''};
(async()=>{try{await openDB();await refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#app').innerHTML='<main class="app">Erreur de stockage local. Recharge Safari.</main>'}})();
</script></body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120509">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro Collection">
<link rel="manifest" href="manifest.json">
<title>Retro Collection</title>
<style>
:root{--bg:#05030a;--panel:#120817;--panel2:#21102b;--text:#fffaf2;--muted:#d0b9d2;--accent:#ff2b16;--accent2:#ffd21a;--blue:#21b7ff;--price:#48f0a0;--danger:#ef4444;--border:#743027;--shadow:0 16px 45px rgba(0,0,0,.68)}
*{box-sizing:border-box}html,body{margin:0;background:#090305;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(circle at 12% 5%,rgba(255,43,22,.38),transparent 25%),radial-gradient(circle at 88% 18%,rgba(33,183,255,.22),transparent 24%),radial-gradient(circle at 50% 100%,rgba(255,210,26,.16),transparent 30%),linear-gradient(135deg,#05030a 0%,#16051b 42%,#09040d 72%,#020207 100%);background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.13) 23px 25px),repeating-linear-gradient(45deg,transparent 0 46px,rgba(255,43,22,.13) 47px 49px);mix-blend-mode:screen}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 14px}
.logo{font-weight:1000;letter-spacing:1px;font-size:23px;text-transform:uppercase;text-shadow:3px 3px 0 #000}.logo span{color:var(--accent2)}
.iconbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:14px}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(72,8,12,.96),rgba(19,6,28,.97) 55%,rgba(5,12,24,.97));border:2px solid #8f3328;border-radius:24px;padding:20px;box-shadow:0 0 0 1px #ff2b1622,0 18px 55px #000b,0 0 35px #ff2b161c;margin-bottom:14px}.hero:before{content:'FIGHT!';position:absolute;right:-18px;top:-28px;font-size:72px;font-weight:1000;font-style:italic;color:#ffffff08;transform:rotate(-8deg)}
.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#0e0e15;border:1px solid var(--border);border-radius:16px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.primary{width:100%;border:2px solid #ff7b18;background:linear-gradient(135deg,#ff2412,#9b0b16 52%,#ffb300);color:white;padding:15px;border-radius:12px;font-weight:1000;letter-spacing:.7px;text-transform:uppercase;margin-top:16px;box-shadow:0 8px 0 #5e0808,0 15px 30px #0008;transform:skew(-2deg);text-shadow:2px 2px 0 #000}
.toolbar{display:flex;gap:9px;margin:14px 0}.search{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:15px;outline:none}
select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:15px;max-width:145px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:linear-gradient(145deg,#180a1e,#0d0714);border:2px solid #552039;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px #000a,0 0 18px #ff2b1610;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-3px) skew(-.5deg);border-color:#ff4b28}.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#20202b}.cardbody{padding:12px}.title{font-weight:800;line-height:1.2}.meta{font-size:12px;color:var(--muted);margin-top:5px}.price{margin-top:10px;font-weight:1000;font-size:18px;color:var(--price);text-shadow:0 0 12px #48f0a055}.estimateBox{margin-top:10px;padding:10px;border:1px solid #6b3d20;border-radius:12px;background:linear-gradient(135deg,#1b0b12,#120b18)}.estimateTitle{font-size:11px;color:#ffd21a;font-weight:900;text-transform:uppercase;letter-spacing:.5px}.estimateMain{font-size:21px;font-weight:1000;color:#48f0a0;margin-top:3px}.estimateRange{font-size:11px;color:var(--muted);margin-top:3px}.estimateBtn{margin-top:8px;width:100%;border:1px solid #ff7b18;background:#2a1017;color:white;padding:8px;border-radius:10px;font-weight:800}.tag{display:inline-block;font-size:11px;background:var(--panel2);padding:4px 7px;border-radius:8px;color:#cfd0db;margin-top:7px}
.empty{text-align:center;padding:35px 16px;color:var(--muted);border:1px dashed var(--border);border-radius:20px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(96%,620px);background:rgba(18,5,7,.96);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;box-shadow:var(--shadow)}nav button{border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:15px;font-size:11px}nav button.active{background:linear-gradient(135deg,#ff2b16,#7d1020);color:white;box-shadow:0 0 18px #ff2b1644}nav .ico{display:block;font-size:19px;margin-bottom:2px}
dialog{width:min(94%,620px);max-height:90vh;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:23px;padding:0;box-shadow:0 30px 80px #000b}dialog::backdrop{background:#000b}.modal{padding:18px;overflow:auto;max-height:90vh}.modal h2{margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;max-width:none;background:#0e0e15;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:13px}.field textarea{min-height:85px;resize:vertical}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:16px;background:#0b0b10;margin-bottom:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1;min-width:130px;padding:12px;border-radius:13px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:700}.actions .ok{background:var(--accent);border-color:var(--accent)}.actions .danger{color:#fecaca;border-color:#5a2020}.hint{font-size:12px;color:var(--muted);line-height:1.45}.loader{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#252533;color:white;border:1px solid var(--border);padding:11px 15px;border-radius:13px;z-index:50;box-shadow:var(--shadow);max-width:90%;font-size:13px}
.consoleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.valuebar{height:8px;background:#29202a;border-radius:99px;overflow:hidden;margin-top:9px}.valuebar i{display:block;height:100%;background:linear-gradient(90deg,#ff3b30,#ffb000);border-radius:99px}.street{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(82,10,12,.98),rgba(19,5,7,.98));border:2px solid #ff3b18;box-shadow:0 0 0 3px #120304,0 16px 45px rgba(255,59,24,.18)}.street:before{content:"FIGHT!";position:absolute;right:-20px;top:-28px;font-size:92px;font-weight:1000;font-style:italic;color:rgba(255,196,0,.08);transform:rotate(-8deg);pointer-events:none}.street:after{content:"◆ ◆ ◆";position:absolute;right:18px;bottom:10px;color:rgba(255,196,0,.2);font-size:18px;letter-spacing:7px;pointer-events:none}.street h1,.street h2{ text-shadow:2px 2px 0 #000}.streetBadge{display:inline-block;background:linear-gradient(90deg,#ff3b18,#ff8a00);color:#fff;font-weight:900;padding:5px 9px;border-radius:8px;transform:skew(-8deg);font-size:11px;letter-spacing:.5px;margin-bottom:9px}@media(max-width:500px){.consoleGrid{grid-template-columns:1fr}}.sectionTitle{font-size:18px;font-weight:850;margin:18px 2px 10px}.subtle{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden class="toast"></div>

<dialog id="gameDialog"><div class="modal" id="gameModal"></div></dialog>
<dialog id="photoDialog"><div class="modal">
  <h2>Ajouter un jeu</h2>
  <p class="hint">Choisis une photo. Elle ne sera envoyée à OpenAI qu'après ta confirmation.</p>
  <div class="actions">
    <button onclick="pickPhoto('camera')">📷 Appareil photo</button>
    <button onclick="pickPhoto('gallery')">🖼️ Galerie</button>
  </div>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
  <input id="galleryInput" type="file" accept="image/*" hidden>
  <div id="photoPreviewWrap"></div>
  <div class="actions"><button onclick="photoDialog.close()">Annuler</button></div>
</div></dialog>

<input id="importInput" type="file" accept="application/json" hidden>

<nav id="nav">
  <button data-page="collection" class="active"><span class="ico">🎮</span>Jeux</button>
  <button data-page="consoles"><span class="ico">🕹️</span>Consoles</button>
  <button data-page="stats"><span class="ico">📊</span>Stats</button>
  <button data-page="backup"><span class="ico">💾</span>Sauvegarde</button>
  <button data-page="settings"><span class="ico">⚙️</span>Réglages</button>
</nav>

<script>
const DB_NAME='retro_collection_db', DB_VER=3, STORE='games', CONSOLE_STORE='consoles';
let db, games=[], consoles=[], page='collection', pendingImage='', pendingConsoleImage='', editingId=null, editingConsoleId=null;

const platforms=['Nintendo','Super Nintendo','Nintendo 64','Game Boy','Game Boy Color','Game Boy Advance','DS','3DS','NES','Wii','Wii U','PlayStation','PlayStation 2','PlayStation 3','PlayStation 4','PlayStation 5','PSP','Xbox','Xbox 360','Xbox One','Xbox Series','Mega Drive','Master System','Dreamcast','Saturn','PC','Autre'];
const conditions=['Cartouche/disque seul','Complet avec boîte','Complet + notice/accessoires','Scellé','Autre'];

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(CONSOLE_STORE))d.createObjectStore(CONSOLE_STORE,{keyPath:'id'});};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function allGames(){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly');const q=t.objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function putGame(g){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(g);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function deleteGame(id){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function allConsoles(){return new Promise((res,rej)=>{const t=db.transaction(CONSOLE_STORE,'readonly');const q=t.objectStore(CONSOLE_STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function putConsole(c){return new Promise((res,rej)=>{const t=db.transaction(CONSOLE_STORE,'readwrite');t.objectStore(CONSOLE_STORE).put(c);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function deleteConsole(id){return new Promise((res,rej)=>{const t=db.transaction(CONSOLE_STORE,'readwrite');t.objectStore(CONSOLE_STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function euro(v){return Number.isFinite(Number(v))?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(v)):'Prix inconnu'}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

async function refresh(){games=await allGames();consoles=await allConsoles();render()}
function nav(){document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function render(){
 const app=$('#app');
 if(page==='collection') app.innerHTML=collectionHTML();
 if(page==='stats') app.innerHTML=statsHTML();
 if(page==='consoles') app.innerHTML=consolesHTML();
 if(page==='backup') app.innerHTML=backupHTML();
 if(page==='settings') app.innerHTML=settingsHTML();
 if(page==='collection') bindCollection();
 if(page==='consoles') bindConsoles();
}
function header(){return `<header><div class="logo">RETRO <span>COLLECTION</span></div><button class="iconbtn" onclick="openAdd()">＋</button></header>`}
function collectionHTML(){
 const q=window._q||'', p=window._p||'Tous';
 let list=games.filter(g=>(!q||`${g.title} ${g.platform} ${g.edition}`.toLowerCase().includes(q.toLowerCase()))&&(p==='Tous'||g.platform===p));
 list.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
 const qty=games.reduce((n,g)=>n+(Number(g.quantity)||1),0), val=games.reduce((n,g)=>n+((Number(g.price)||0)*(Number(g.quantity)||1)),0);
 return `<div class="app">${header()}<section class="hero"><h1>Ma collection</h1><p>Ta collection reste sur cet iPhone.</p>
 <div class="stats"><div class="stat"><b>${games.length}</b><span>jeux</span></div><div class="stat"><b>${qty}</b><span>exemplaires</span></div><div class="stat"><b>${euro(val)}</b><span>valeur connue</span></div></div>
 <button class="primary" onclick="openAdd()">📸 Ajouter un jeu par photo</button></section>
 <div class="toolbar"><input class="search" id="search" placeholder="Rechercher un jeu…" value="${escapeHtml(q)}"><select id="platformFilter"><option>Tous</option>${platforms.map(x=>`<option ${p===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
 ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">Aucun jeu ici.<br><br>Appuie sur « Ajouter un jeu par photo » pour commencer.</div>`}
 </div>`;
}
function card(g){const est=g.estimate;return `<article class="card" onclick="editGame('${g.id}')">${g.image?`<img class="thumb" src="${g.image}" alt="">`:`<div class="thumb"></div>`}<div class="cardbody"><div class="title">${escapeHtml(g.title||'Jeu sans titre')}</div><div class="meta">${escapeHtml(g.platform||'Console inconnue')}${g.edition?' · '+escapeHtml(g.edition):''}</div><span class="tag">${escapeHtml(g.condition||'État non renseigné')} · x${g.quantity||1}</span><div class="price">${g.price!==''&&g.price!=null?euro(Number(g.price)*(Number(g.quantity)||1)):'Prix personnel non renseigné'}</div>${est?.typical!=null?`<div class="estimateBox"><div class="estimateTitle">🤖 Estimation automatique</div><div class="estimateMain">${euro(est.typical)}</div><div class="estimateRange">${euro(est.low)} – ${euro(est.high)} · ${est.count||0} prix analysés</div>${est.updatedAt?`<div class="hint">📅 ${new Intl.DateTimeFormat('fr-FR').format(new Date(est.updatedAt))}</div>`:''} </div>`:''}<button class="estimateBtn" onclick="event.stopPropagation();estimateGame('${g.id}')">🔎 ${est?'Actualiser':'Estimer la valeur'}</button></div></article>`}
function bindCollection(){const s=$('#search'), f=$('#platformFilter');if(s)s.oninput=()=>{window._q=s.value;render()};if(f)f.onchange=()=>{window._p=f.value;render()}}
function consoleSearchUrl(c){return 'https://www.vinted.fr/catalog?search_text='+encodeURIComponent([c.name,c.model,c.edition].filter(Boolean).join(' '))}
function consoleEbayUrl(c){return 'https://www.ebay.fr/sch/i.html?_nkw='+encodeURIComponent([c.name,c.model,c.edition].filter(Boolean).join(' '))}
function consolesHTML(){const q=window._cq||'';let list=consoles.filter(c=>(!q||`${c.name} ${c.model} ${c.edition}`.toLowerCase().includes(q.toLowerCase())));return `<div class="app">${header()}<section class="hero street"><span class="streetBadge">⚡ FIGHT • COLLECT • REPEAT ⚡</span><h1>🕹️ MES CONSOLES</h1><p>Garde aussi une trace de tes machines, éditions et valeurs.</p><button class="primary" onclick="openConsoleEditor()">＋ Ajouter une console</button></section><div class="toolbar"><input class="search" id="consoleSearch" placeholder="Rechercher une console…" value="${escapeHtml(q)}"></div><div class="consoleGrid">${list.map(consoleCard).join('')||'<div class="empty" style="grid-column:1/-1">Aucune console enregistrée.</div>'}</div></div>`}
function consoleCard(c){return `<article class="card" onclick="editConsole('${c.id}')">${c.image?`<img class="thumb" src="${c.image}" alt="">`:`<div class="thumb"></div>`}<div class="cardbody"><div class="title">${escapeHtml(c.name||'Console')}</div><div class="meta">${escapeHtml(c.model||'Modèle non renseigné')}${c.edition?' · '+escapeHtml(c.edition):''}</div><span class="tag">${escapeHtml(c.condition||'État non renseigné')} · x${c.quantity||1}</span><div class="price">${c.price!==''&&c.price!=null?euro(Number(c.price)*(Number(c.quantity)||1)):'Valeur inconnue'}</div></div></article>`}
function bindConsoles(){const s=$('#consoleSearch');if(s)s.oninput=()=>{window._cq=s.value;render()}}
function openConsoleEditor(c={}){editingConsoleId=c.id||null;pendingConsoleImage=c.image||'';gameDialog.innerHTML=`<div class="modal"><h2>${c.id?'Modifier':'Ajouter'} une console</h2><div class="field"><label>Nom</label><input id="cName" value="${escapeHtml(c.name||'')}" placeholder="PlayStation 2"></div><div class="row"><div class="field"><label>Modèle</label><input id="cModel" value="${escapeHtml(c.model||'')}" placeholder="Slim, Fat…"></div><div class="field"><label>Édition</label><input id="cEdition" value="${escapeHtml(c.edition||'')}" placeholder="Édition spéciale…"></div></div><div class="row"><div class="field"><label>Année</label><input id="cYear" type="number" value="${escapeHtml(c.year||'')}"></div><div class="field"><label>Quantité</label><input id="cQty" type="number" min="1" value="${c.quantity||1}"></div></div><div class="field"><label>État</label><select id="cCondition">${['Très bon état','Bon état','État moyen','À restaurer','Scellée'].map(x=>`<option ${c.condition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Valeur estimée (€) — saisie manuelle</label><input id="cPrice" type="number" step="0.01" value="${c.price??''}"></div><div class="field"><label>Date de valeur</label><input id="cPriceDate" type="date" value="${escapeHtml(c.priceDate||'')}"></div></div><div class="field"><label>Photo de la console</label><input id="cImageFile" type="file" accept="image/*"><div id="cImagePreview">${c.image?`<img class="preview" src="${c.image}">`:''}</div></div><div class="field"><label>Notes</label><textarea id="cNotes">${escapeHtml(c.notes||'')}</textarea></div><div class="actions"><button onclick="gameDialog.close()">Annuler</button>${c.name?`<button onclick="window.open(consoleEbayUrlFromForm(),'_blank')">🔎 eBay</button>`:''}${c.name?`<button onclick="window.open(consoleVintedUrlFromForm(),'_blank')">🟢 Vinted</button>`:''}<button class="ok" onclick="saveConsoleEditor()">💾 Enregistrer</button>${c.id?'<button class="danger" onclick="removeConsole()">🗑️ Supprimer</button>':''}</div></div>`;gameDialog.showModal()}
async function saveConsoleEditor(){const old=editingConsoleId?consoles.find(x=>x.id===editingConsoleId):null;const file=$('#cImageFile')?.files?.[0];if(file) pendingConsoleImage=await resizeImage(file);const c={id:editingConsoleId||crypto.randomUUID(),image:pendingConsoleImage||old?.image||'',name:$('#cName').value.trim(),model:$('#cModel').value.trim(),edition:$('#cEdition').value.trim(),year:$('#cYear').value||'',condition:$('#cCondition').value,quantity:Math.max(1,Number($('#cQty').value)||1),price:$('#cPrice').value===''?'':Number($('#cPrice').value),priceDate:$('#cPriceDate').value,notes:$('#cNotes').value.trim(),updatedAt:new Date().toISOString()};await putConsole(c);pendingConsoleImage='';gameDialog.close();await refresh();toast('Console enregistrée')}
function editConsole(id){const c=consoles.find(x=>x.id===id);if(c){pendingConsoleImage=c.image||'';openConsoleEditor(c)}}
async function removeConsole(){if(!editingConsoleId)return;if(confirm('Supprimer définitivement cette console ?')){await deleteConsole(editingConsoleId);gameDialog.close();await refresh();toast('Console supprimée')}}
function consoleVintedUrlFromForm(){return consoleSearchUrl({name:$('#cName')?.value||'',model:$('#cModel')?.value||'',edition:$('#cEdition')?.value||''})}
function consoleEbayUrlFromForm(){return consoleEbayUrl({name:$('#cName')?.value||'',model:$('#cModel')?.value||'',edition:$('#cEdition')?.value||''})}

function statsHTML(){const total=games.reduce((n,g)=>n+(Number(g.quantity)||1),0),val=games.reduce((n,g)=>n+(Number(g.price)||0)*(Number(g.quantity)||1),0),cQty=consoles.reduce((n,c)=>n+(Number(c.quantity)||1),0),cVal=consoles.reduce((n,c)=>n+(Number(c.price)||0)*(Number(c.quantity)||1),0);const by={};games.forEach(g=>{const k=g.platform||'Inconnue';if(!by[k])by[k]={qty:0,val:0};by[k].qty+=(Number(g.quantity)||1);by[k].val+=(Number(g.price)||0)*(Number(g.quantity)||1)});const max=Math.max(1,...Object.values(by).map(x=>x.val));const platformRows=Object.entries(by).sort((a,b)=>b[1].val-a[1].val).map(([k,v])=>`<div class="stat" style="margin:9px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${escapeHtml(k)}</b><span>${euro(v.val)}</span></div><div class="meta">${v.qty} exemplaire(s)</div><div class="valuebar"><i style="width:${Math.max(2,Math.round(v.val/max*100))}%"></i></div></div>`).join('')||'<div class="empty">Pas encore de jeux.</div>';return `<div class="app">${header()}<div class="sectionTitle">📊 Statistiques</div><section class="hero street"><span class="streetBadge">COLLECTION POWER</span><div class="stats"><div class="stat"><b>${games.length}</b><span>jeux</span></div><div class="stat"><b>${total}</b><span>exemplaires</span></div><div class="stat"><b>${euro(val)}</b><span>valeur jeux</span></div></div><div class="stats"><div class="stat"><b>${consoles.length}</b><span>consoles</span></div><div class="stat"><b>${cQty}</b><span>machines</span></div><div class="stat"><b>${euro(cVal)}</b><span>valeur consoles</span></div></div></section><div class="sectionTitle">💰 Valeur des jeux par plateforme</div>${platformRows}</div>`}
function backupHTML(){return `<div class="app">${header()}<div class="sectionTitle">Sauvegarde</div><section class="hero"><h2 style="margin-top:0">Tes données restent locales</h2><p class="hint">Exporte régulièrement ta collection. Le fichier JSON contient aussi les photos enregistrées dans l'application.</p><div class="actions"><button class="ok" onclick="exportData()">📤 Exporter</button><button onclick="$('#importInput').click()">📥 Importer</button></div><p class="hint" style="margin-top:14px">L'import peut remplacer les données actuelles : une confirmation sera demandée.</p></section></div>`}
function settingsHTML(){const api=localStorage.getItem('retro_api_url')||'';return `<div class="app">${header()}<div class="sectionTitle">Réglages</div><section class="hero"><h2 style="margin-top:0">IA de reconnaissance</h2><p class="hint">L'URL ci-dessous sera appelée uniquement lorsque tu demandes une reconnaissance. La clé OpenAI n'est jamais stockée ici.</p><div class="field"><label>URL de ton serveur sécurisé</label><input id="apiUrl" value="${escapeHtml(api)}" placeholder="https://ton-worker.workers.dev"></div><div class="actions"><button class="ok" onclick="saveSettings()">Enregistrer</button><button onclick="testWorker()">🔌 Tester la connexion</button></div><p id="workerStatus" class="hint"></p></section><section class="hero"><h2 style="margin-top:0">Sécurité</h2><p class="hint">Ne colle jamais ta clé OpenAI dans cette application. Elle doit rester comme secret côté serveur.</p></section></div>`}
function saveSettings(){localStorage.setItem('retro_api_url',$('#apiUrl').value.trim().replace(/\/$/,''));toast('Réglages enregistrés');}
async function testWorker(){const url=localStorage.getItem('retro_api_url')||$('#apiUrl')?.value.trim().replace(/\/$/,'');const out=$('#workerStatus');if(!url){toast('Indique d’abord l’URL du Worker.');return}if(out)out.textContent='Test en cours…';try{const r=await fetch(url,{method:'GET'});const text=await r.text();if(out)out.textContent=`Serveur joignable : HTTP ${r.status} — ${text.slice(0,120)}`;toast('Serveur joignable');}catch(e){if(out)out.textContent='Connexion impossible : '+e.message;toast('Connexion impossible');}}
function openAdd(){editingId=null;pendingImage='';$('#photoPreviewWrap').innerHTML='';$('#photoDialog').showModal()}
const photoDialog=$('#photoDialog');
function pickPhoto(which){$(which==='camera'?'#cameraInput':'#galleryInput').click()}
$('#cameraInput').onchange=e=>handleFile(e.target.files[0]);
$('#galleryInput').onchange=e=>handleFile(e.target.files[0]);
async function handleFile(file){if(!file)return;pendingImage=await resizeImage(file);$('#photoPreviewWrap').innerHTML=`<img class="preview" src="${pendingImage}"><p class="hint">Photo prête. Tu peux l'envoyer à l'IA après confirmation.</p><div class="actions"><button class="ok" onclick="recognizePhoto()">🤖 Reconnaître avec OpenAI</button></div>`}
function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function recognizePhoto(){
 const url=localStorage.getItem('retro_api_url');if(!url){toast('Configure d’abord l’URL du serveur dans Réglages.');return}
 const wrap=$('#photoPreviewWrap');wrap.insertAdjacentHTML('beforeend','<p id="loading" class="hint"><span class="loader"></span> Analyse en cours…</p>');
 try{
   const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);
   const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:pendingImage}),signal:controller.signal});
   clearTimeout(timer);
   const raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{};}catch{}
   if(!r.ok)throw new Error(data.error||`Erreur serveur HTTP ${r.status}`);
   if(!data.title && !data.platform)throw new Error('Le serveur a répondu sans identification.');
   photoDialog.close();openEditor({...data,image:pendingImage});
 }catch(e){
   $('#loading')?.remove();
   const msg=e.name==='AbortError'?'Le serveur met trop de temps à répondre.':e.message;
   wrap.insertAdjacentHTML('beforeend',`<p class="hint" style="color:#fecaca">❌ ${escapeHtml(msg)}</p>`);toast('Reconnaissance impossible');
 }
}
function openEditor(g={}){
 editingId=g.id||null; window._pendingEstimate=g.estimate||null;
 const d=$('#gameDialog');$('#gameModal').innerHTML=`<h2>${editingId?'Modifier le jeu':'Vérifier le jeu'}</h2>
 <img class="preview" src="${g.image||''}" ${g.image?'':'style="display:none"'}>
 <div class="field"><label>Titre</label><input id="fTitle" value="${escapeHtml(g.title||'')}"></div>
 <div class="row"><div class="field"><label>Console / plateforme</label><input id="fPlatform" list="platformsList" value="${escapeHtml(g.platform||'')}"><datalist id="platformsList">${platforms.map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</datalist></div>
 <div class="field"><label>Année</label><input id="fYear" type="number" value="${g.year||''}"></div></div>
 <div class="field"><label>Édition / version</label><input id="fEdition" value="${escapeHtml(g.edition||'')}"></div>
 <div class="field"><label>État</label><select id="fCondition">${conditions.map(x=>`<option ${g.condition===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
 <div class="row"><div class="field"><label>Quantité</label><input id="fQty" type="number" min="1" value="${g.quantity||1}"></div><div class="field"><label>Prix personnel (€)</label><input id="fPrice" type="number" min="0" step="0.01" value="${g.price??''}"></div></div>${g.estimate?.typical!=null?`<div class="estimateBox"><div class="estimateTitle">🤖 Estimation automatique</div><div class="estimateMain">${euro(g.estimate.typical)}</div><div class="estimateRange">${euro(g.estimate.low)} – ${euro(g.estimate.high)} · ${g.estimate.count||0} prix analysés</div></div>`:''}
 <div class="field"><label>Date de l'estimation</label><input id="fPriceDate" type="date" value="${g.priceDate||''}"></div>
 <div class="field"><label>Notes</label><textarea id="fNotes">${escapeHtml(g.notes||'')}</textarea></div>
 <p class="hint">Confiance IA : ${escapeHtml(g.confidence||'non indiquée')}. Corrige librement les informations avant d'enregistrer.</p>
 <div class="actions"><button onclick="gameDialog.close()">Annuler</button>${g.title?`<button onclick="window.open(vintedUrlFromForm(), '_blank')">🟢 Vinted</button>`:''}${g.title?`<button onclick="window.open(ebayUrlFromForm(), '_blank')">🔎 eBay</button>`:''}<button onclick="estimateEditingGame()">🤖 Estimer la valeur</button><button class="ok" onclick="saveEditor()">💾 Enregistrer</button>${editingId?'<button class="danger" onclick="removeEditing()">🗑️ Supprimer</button>':''}</div>`;
 d.showModal();
}
const gameDialog=$('#gameDialog');
async function saveEditor(){const old=editingId?games.find(x=>x.id===editingId):null;const g={id:editingId||crypto.randomUUID(),image:old?.image||pendingImage,title:$('#fTitle').value.trim(),platform:$('#fPlatform').value.trim(),year:$('#fYear').value||'',edition:$('#fEdition').value.trim(),condition:$('#fCondition').value,quantity:Math.max(1,Number($('#fQty').value)||1),price:$('#fPrice').value===''?'':Number($('#fPrice').value),priceDate:$('#fPriceDate').value,notes:$('#fNotes').value.trim(),estimate:window._pendingEstimate||old?.estimate||null,updatedAt:new Date().toISOString()};await putGame(g);gameDialog.close();pendingImage='';window._pendingEstimate=null;await refresh();toast('Jeu enregistré')}
async function editGame(id){const g=games.find(x=>x.id===id);if(g)openEditor(g)}
async function estimateEditingGame(){
 const g={id:editingId,title:$('#fTitle')?.value.trim(),platform:$('#fPlatform')?.value.trim(),year:$('#fYear')?.value||'',edition:$('#fEdition')?.value.trim(),condition:$('#fCondition')?.value||''};
 if(!g.title){toast('Indique d’abord le titre du jeu.');return}
 await estimateGameData(g,true);
}
async function estimateGame(id){const g=games.find(x=>x.id===id);if(g)await estimateGameData(g,false)}
async function estimateGameData(g,fromEditor){
  const url=localStorage.getItem('retro_api_url');
  if(!url){toast('Configure d’abord l’URL du serveur dans Réglages.');return}
  toast('Recherche des prix en ligne…');
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),60000);
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'estimate',
        game:{
          title:g.title,
          platform:g.platform,
          year:g.year,
          edition:g.edition,
          condition:g.condition
        }
      }),
      signal:controller.signal
    });
    clearTimeout(timer);

    const raw=await r.text();
    let data={};
    try{data=raw?JSON.parse(raw):{}}catch{}

    if(!r.ok)throw new Error(data.error||`Erreur serveur HTTP ${r.status}`);
    if(!Number.isFinite(Number(data.typical)))
      throw new Error('Aucune estimation exploitable n’a été trouvée.');

    const now=new Date();
    const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

    const est={
      low:Number(data.low),
      typical:Number(data.typical),
      high:Number(data.high),
      count:Number(data.count)||0,
      updatedAt:now.toISOString(),
      sources:Array.isArray(data.sources)?data.sources:[]
    };

    if(fromEditor){
      const old=editingId?games.find(x=>x.id===editingId):null;
      if(old)old.estimate=est;

      // La valeur estimée est automatiquement inscrite dans la case Prix.
      const priceInput=$('#fPrice');
      const dateInput=$('#fPriceDate');
      if(priceInput)priceInput.value=String(est.typical);
      if(dateInput)dateInput.value=today;

      // Évite d'afficher plusieurs blocs d'estimation si on relance une recherche.
      $('#gameModal .estimateBox')?.remove();

      $('#gameModal').insertAdjacentHTML('beforeend',
        `<div class="estimateBox">
          <div class="estimateTitle">🤖 Estimation automatique</div>
          <div class="estimateMain">${euro(est.typical)}</div>
          <div class="estimateRange">${euro(est.low)} – ${euro(est.high)} · ${est.count} prix analysés</div>
          <div class="hint">📅 Estimation du ${new Intl.DateTimeFormat('fr-FR').format(now)}</div>
        </div>`
      );

      window._pendingEstimate=est;
      toast('Valeur et date enregistrées dans la fiche');
    }else{
      const idx=games.findIndex(x=>x.id===g.id);
      if(idx>=0){
        games[idx].estimate=est;
        // La valeur estimée devient automatiquement le prix enregistré.
        games[idx].price=Number(est.typical);
        games[idx].priceDate=today;

        await putGame(games[idx]);
        await refresh();
        toast('Valeur et date enregistrées');
      }
    }
  }catch(e){
    toast(e.name==='AbortError'
      ?'La recherche prend trop de temps.'
      :('Estimation impossible : '+e.message));
  }
}
async function removeEditing(){if(!editingId)return;if(confirm('Supprimer définitivement ce jeu ?')){await deleteGame(editingId);gameDialog.close();await refresh();toast('Jeu supprimé')}}
function vintedUrl(g){return 'https://www.vinted.fr/catalog?search_text='+encodeURIComponent([g.title,g.platform,g.edition].filter(Boolean).join(' '))}
function vintedUrlFromForm(){return vintedUrl({title:$('#fTitle')?.value||'',platform:$('#fPlatform')?.value||'',edition:$('#fEdition')?.value||''})}
function ebayUrl(g){return 'https://www.ebay.fr/sch/i.html?_nkw='+encodeURIComponent([g.title,g.platform,g.edition].filter(Boolean).join(' '))}
function ebayUrlFromForm(){return ebayUrl({title:$('#fTitle')?.value||'',platform:$('#fPlatform')?.value||'',edition:$('#fEdition')?.value||''})}
function exportData(){const payload={app:'Retro Collection',version:2,exportedAt:new Date().toISOString(),games,consoles};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='retro-collection-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.games))throw new Error('Fichier invalide');if(!confirm('Remplacer la collection actuelle par cette sauvegarde ?'))return;for(const g of games)await deleteGame(g.id);for(const g of data.games)await putGame(g);for(const c of consoles)await deleteConsole(c.id);for(const c of (data.consoles||[]))await putConsole(c);await refresh();toast('Sauvegarde importée')}catch(err){toast('Import impossible : '+err.message)}e.target.value=''}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ebay]');if(a){e.preventDefault();const g=games.find(x=>x.id===a.dataset.ebay);if(g)location.href=ebayUrl(g)}});

(async()=>{await openDB();nav();await refresh();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script>

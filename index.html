<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro Collection">
<link rel="manifest" href="manifest.json">
<title>Retro Collection</title>
<style>
:root{--bg:#09090e;--panel:#13131c;--panel2:#1b1b27;--text:#f5f5fa;--muted:#9b9baa;--accent:#8b5cf6;--accent2:#22d3ee;--danger:#ef4444;--border:#2a2a38;--shadow:0 12px 35px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 14px}
.logo{font-weight:900;letter-spacing:.5px;font-size:23px}.logo span{color:var(--accent2)}
.iconbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:14px}
.hero{background:linear-gradient(145deg,#171522,#101019);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#0e0e15;border:1px solid var(--border);border-radius:16px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.primary{width:100%;border:0;background:linear-gradient(135deg,var(--accent),#6d28d9);color:white;padding:15px;border-radius:17px;font-weight:800;margin-top:16px;box-shadow:0 10px 25px rgba(124,58,237,.25)}
.toolbar{display:flex;gap:9px;margin:14px 0}.search{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:15px;outline:none}
select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:15px;max-width:145px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--panel);border:1px solid var(--border);border-radius:19px;overflow:hidden;box-shadow:var(--shadow)}.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#20202b}.cardbody{padding:12px}.title{font-weight:800;line-height:1.2}.meta{font-size:12px;color:var(--muted);margin-top:5px}.price{margin-top:9px;font-weight:800}.tag{display:inline-block;font-size:11px;background:var(--panel2);padding:4px 7px;border-radius:8px;color:#cfd0db;margin-top:7px}
.empty{text-align:center;padding:35px 16px;color:var(--muted);border:1px dashed var(--border);border-radius:20px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(94%,560px);background:rgba(19,19,28,.94);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);z-index:20;box-shadow:var(--shadow)}nav button{border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:15px;font-size:11px}nav button.active{background:var(--panel2);color:white}nav .ico{display:block;font-size:19px;margin-bottom:2px}
dialog{width:min(94%,620px);max-height:90vh;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:23px;padding:0;box-shadow:0 30px 80px #000b}dialog::backdrop{background:#000b}.modal{padding:18px;overflow:auto;max-height:90vh}.modal h2{margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;max-width:none;background:#0e0e15;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:13px}.field textarea{min-height:85px;resize:vertical}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:16px;background:#0b0b10;margin-bottom:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1;min-width:130px;padding:12px;border-radius:13px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:700}.actions .ok{background:var(--accent);border-color:var(--accent)}.actions .danger{color:#fecaca;border-color:#5a2020}.hint{font-size:12px;color:var(--muted);line-height:1.45}.loader{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#252533;color:white;border:1px solid var(--border);padding:11px 15px;border-radius:13px;z-index:50;box-shadow:var(--shadow);max-width:90%;font-size:13px}
.sectionTitle{font-size:18px;font-weight:850;margin:18px 2px 10px}.subtle{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden class="toast"></div>

<dialog id="gameDialog"><div class="modal" id="gameModal"></div></dialog>
<dialog id="photoDialog"><div class="modal">
  <h2>Ajouter un jeu</h2>
  <p class="hint">Choisis une photo. Elle ne sera envoyée à OpenAI qu'après ta confirmation.</p>
  <div class="actions">
    <button onclick="pickPhoto('camera')">📷 Appareil photo</button>
    <button onclick="pickPhoto('gallery')">🖼️ Galerie</button>
  </div>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
  <input id="galleryInput" type="file" accept="image/*" hidden>
  <div id="photoPreviewWrap"></div>
  <div class="actions"><button onclick="photoDialog.close()">Annuler</button></div>
</div></dialog>

<input id="importInput" type="file" accept="application/json" hidden>

<nav id="nav">
  <button data-page="collection" class="active"><span class="ico">🎮</span>Collection</button>
  <button data-page="stats"><span class="ico">📊</span>Stats</button>
  <button data-page="backup"><span class="ico">💾</span>Sauvegarde</button>
  <button data-page="settings"><span class="ico">⚙️</span>Réglages</button>
</nav>

<script>
const DB_NAME='retro_collection_db', DB_VER=1, STORE='games';
let db, games=[], page='collection', pendingImage='', editingId=null;

const platforms=['Nintendo','Super Nintendo','Nintendo 64','Game Boy','Game Boy Color','Game Boy Advance','DS','3DS','NES','Wii','Wii U','PlayStation','PlayStation 2','PlayStation 3','PlayStation 4','PlayStation 5','PSP','Xbox','Xbox 360','Xbox One','Xbox Series','Mega Drive','Master System','Dreamcast','Saturn','PC','Autre'];
const conditions=['Cartouche/disque seul','Complet avec boîte','Complet + notice/accessoires','Scellé','Autre'];

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function allGames(){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly');const q=t.objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function putGame(g){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(g);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function deleteGame(id){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function euro(v){return Number.isFinite(Number(v))?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(v)):'Prix inconnu'}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

async function refresh(){games=await allGames();render()}
function nav(){document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function render(){
 const app=$('#app');
 if(page==='collection') app.innerHTML=collectionHTML();
 if(page==='stats') app.innerHTML=statsHTML();
 if(page==='backup') app.innerHTML=backupHTML();
 if(page==='settings') app.innerHTML=settingsHTML();
 if(page==='collection') bindCollection();
}
function header(){return `<header><div class="logo">RETRO <span>COLLECTION</span></div><button class="iconbtn" onclick="openAdd()">＋</button></header>`}
function collectionHTML(){
 const q=window._q||'', p=window._p||'Tous';
 let list=games.filter(g=>(!q||`${g.title} ${g.platform} ${g.edition}`.toLowerCase().includes(q.toLowerCase()))&&(p==='Tous'||g.platform===p));
 list.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
 const qty=games.reduce((n,g)=>n+(Number(g.quantity)||1),0), val=games.reduce((n,g)=>n+((Number(g.price)||0)*(Number(g.quantity)||1)),0);
 return `<div class="app">${header()}<section class="hero"><h1>Ma collection</h1><p>Ta collection reste sur cet iPhone.</p>
 <div class="stats"><div class="stat"><b>${games.length}</b><span>jeux</span></div><div class="stat"><b>${qty}</b><span>exemplaires</span></div><div class="stat"><b>${euro(val)}</b><span>valeur connue</span></div></div>
 <button class="primary" onclick="openAdd()">📸 Ajouter un jeu par photo</button></section>
 <div class="toolbar"><input class="search" id="search" placeholder="Rechercher un jeu…" value="${escapeHtml(q)}"><select id="platformFilter"><option>Tous</option>${platforms.map(x=>`<option ${p===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
 ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">Aucun jeu ici.<br><br>Appuie sur « Ajouter un jeu par photo » pour commencer.</div>`}
 </div>`;
}
function card(g){return `<article class="card" onclick="editGame('${g.id}')">${g.image?`<img class="thumb" src="${g.image}" alt="">`:`<div class="thumb"></div>`}<div class="cardbody"><div class="title">${escapeHtml(g.title||'Jeu sans titre')}</div><div class="meta">${escapeHtml(g.platform||'Console inconnue')}${g.edition?' · '+escapeHtml(g.edition):''}</div><span class="tag">${escapeHtml(g.condition||'État non renseigné')} · x${g.quantity||1}</span><div class="price">${g.price!==''&&g.price!=null?euro(Number(g.price)*(Number(g.quantity)||1)):'Prix inconnu'}</div></div></article>`}
function bindCollection(){const s=$('#search'), f=$('#platformFilter');if(s)s.oninput=()=>{window._q=s.value;render()};if(f)f.onchange=()=>{window._p=f.value;render()}}
function statsHTML(){const total=games.reduce((n,g)=>n+(Number(g.quantity)||1),0),val=games.reduce((n,g)=>n+(Number(g.price)||0)*(Number(g.quantity)||1),0),known=games.filter(g=>g.price!==''&&g.price!=null).length;
 const by={};games.forEach(g=>by[g.platform||'Inconnue']=(by[g.platform||'Inconnue']||0)+(Number(g.quantity)||1));
 const platformRows=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="stat" style="margin:7px 0;display:flex;justify-content:space-between"><b>'+escapeHtml(k)+'</b><span>'+v+' exemplaire(s)</span></div>').join('')||'<div class="empty">Pas encore de données.</div>';
 return `<div class="app">${header()}<div class="sectionTitle">Statistiques</div><section class="hero"><div class="stats"><div class="stat"><b>${games.length}</b><span>jeux</span></div><div class="stat"><b>${total}</b><span>exemplaires</span></div><div class="stat"><b>${euro(val)}</b><span>valeur connue</span></div></div><p class="hint" style="margin-top:14px">${known} jeu(x) avec un prix renseigné · ${games.length-known} sans prix.</p></section><div class="sectionTitle">Par plateforme</div>${platformRows}</div>`}

function backupHTML(){return `<div class="app">${header()}<div class="sectionTitle">Sauvegarde</div><section class="hero"><h2 style="margin-top:0">Tes données restent locales</h2><p class="hint">Exporte régulièrement ta collection. Le fichier JSON contient aussi les photos enregistrées dans l'application.</p><div class="actions"><button class="ok" onclick="exportData()">📤 Exporter</button><button onclick="$('#importInput').click()">📥 Importer</button></div><p class="hint" style="margin-top:14px">L'import peut remplacer les données actuelles : une confirmation sera demandée.</p></section></div>`}
function settingsHTML(){const api=localStorage.getItem('retro_api_url')||'';return `<div class="app">${header()}<div class="sectionTitle">Réglages</div><section class="hero"><h2 style="margin-top:0">IA de reconnaissance</h2><p class="hint">L'URL ci-dessous sera appelée uniquement lorsque tu demandes une reconnaissance. La clé OpenAI n'est jamais stockée ici.</p><div class="field"><label>URL de ton serveur sécurisé</label><input id="apiUrl" value="${escapeHtml(api)}" placeholder="https://ton-worker.workers.dev/recognize"></div><div class="actions"><button class="ok" onclick="saveSettings()">Enregistrer</button></div></section><section class="hero"><h2 style="margin-top:0">Sécurité</h2><p class="hint">Ne colle jamais ta clé OpenAI dans cette application. Elle doit rester comme secret côté serveur.</p></section></div>`}
function saveSettings(){localStorage.setItem('retro_api_url',$('#apiUrl').value.trim().replace(/\/$/,''));toast('Réglages enregistrés');}
function openAdd(){editingId=null;pendingImage='';$('#photoPreviewWrap').innerHTML='';$('#photoDialog').showModal()}
const photoDialog=$('#photoDialog');
function pickPhoto(which){$(which==='camera'?'#cameraInput':'#galleryInput').click()}
$('#cameraInput').onchange=e=>handleFile(e.target.files[0]);
$('#galleryInput').onchange=e=>handleFile(e.target.files[0]);
async function handleFile(file){if(!file)return;pendingImage=await resizeImage(file);$('#photoPreviewWrap').innerHTML=`<img class="preview" src="${pendingImage}"><p class="hint">Photo prête. Tu peux l'envoyer à l'IA après confirmation.</p><div class="actions"><button class="ok" onclick="recognizePhoto()">🤖 Reconnaître avec OpenAI</button></div>`}
function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function recognizePhoto(){
 const url=localStorage.getItem('retro_api_url');if(!url){toast('Configure d’abord l’URL du serveur dans Réglages.');return}
 const wrap=$('#photoPreviewWrap');wrap.insertAdjacentHTML('beforeend','<p id="loading" class="hint"><span class="loader"></span> Analyse en cours…</p>');
 try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:pendingImage})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erreur serveur');photoDialog.close();openEditor({...data,image:pendingImage});}
 catch(e){$('#loading')?.remove();toast('Erreur : '+e.message)}
}
function openEditor(g={}){
 editingId=g.id||null;
 const d=$('#gameDialog');$('#gameModal').innerHTML=`<h2>${editingId?'Modifier le jeu':'Vérifier le jeu'}</h2>
 <img class="preview" src="${g.image||''}" ${g.image?'':'style="display:none"'}>
 <div class="field"><label>Titre</label><input id="fTitle" value="${escapeHtml(g.title||'')}"></div>
 <div class="row"><div class="field"><label>Console / plateforme</label><input id="fPlatform" list="platformsList" value="${escapeHtml(g.platform||'')}"><datalist id="platformsList">${platforms.map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</datalist></div>
 <div class="field"><label>Année</label><input id="fYear" type="number" value="${g.year||''}"></div></div>
 <div class="field"><label>Édition / version</label><input id="fEdition" value="${escapeHtml(g.edition||'')}"></div>
 <div class="field"><label>État</label><select id="fCondition">${conditions.map(x=>`<option ${g.condition===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
 <div class="row"><div class="field"><label>Quantité</label><input id="fQty" type="number" min="1" value="${g.quantity||1}"></div><div class="field"><label>Prix estimé (€)</label><input id="fPrice" type="number" min="0" step="0.01" value="${g.price??''}"></div></div>
 <div class="field"><label>Date de l'estimation</label><input id="fPriceDate" type="date" value="${g.priceDate||''}"></div>
 <div class="field"><label>Notes</label><textarea id="fNotes">${escapeHtml(g.notes||'')}</textarea></div>
 <p class="hint">Confiance IA : ${escapeHtml(g.confidence||'non indiquée')}. Corrige librement les informations avant d'enregistrer.</p>
 <div class="actions"><button onclick="gameDialog.close()">Annuler</button><button class="ok" onclick="saveEditor()">💾 Enregistrer</button>${editingId?'<button class="danger" onclick="removeEditing()">🗑️ Supprimer</button>':''}</div>`;
 d.showModal();
}
const gameDialog=$('#gameDialog');
async function saveEditor(){const old=editingId?games.find(x=>x.id===editingId):null;const g={id:editingId||crypto.randomUUID(),image:old?.image||pendingImage,title:$('#fTitle').value.trim(),platform:$('#fPlatform').value.trim(),year:$('#fYear').value||'',edition:$('#fEdition').value.trim(),condition:$('#fCondition').value,quantity:Math.max(1,Number($('#fQty').value)||1),price:$('#fPrice').value===''?'':Number($('#fPrice').value),priceDate:$('#fPriceDate').value,notes:$('#fNotes').value.trim(),updatedAt:new Date().toISOString()};await putGame(g);gameDialog.close();pendingImage='';await refresh();toast('Jeu enregistré')}
async function editGame(id){const g=games.find(x=>x.id===id);if(g)openEditor(g)}
async function removeEditing(){if(!editingId)return;if(confirm('Supprimer définitivement ce jeu ?')){await deleteGame(editingId);gameDialog.close();await refresh();toast('Jeu supprimé')}}
function ebayUrl(g){return 'https://www.ebay.fr/sch/i.html?_nkw='+encodeURIComponent([g.title,g.platform,g.edition].filter(Boolean).join(' '))}
function exportData(){const payload={app:'Retro Collection',version:1,exportedAt:new Date().toISOString(),games};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='retro-collection-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.games))throw new Error('Fichier invalide');if(!confirm('Remplacer la collection actuelle par cette sauvegarde ?'))return;for(const g of games)await deleteGame(g.id);for(const g of data.games)await putGame(g);await refresh();toast('Sauvegarde importée')}catch(err){toast('Import impossible : '+err.message)}e.target.value=''}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ebay]');if(a){e.preventDefault();const g=games.find(x=>x.id===a.dataset.ebay);if(g)location.href=ebayUrl(g)}});

(async()=>{await openDB();nav();await refresh();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script>
</body>
</html>

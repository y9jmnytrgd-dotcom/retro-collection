<script>
const DB_NAME='retro_collection_db', DB_VER=3, STORE='games', CONSOLE_STORE='consoles';
let db, games=[], consoles=[], page='collection', pendingImage='', pendingConsoleImage='', editingId=null, editingConsoleId=null, selectedGameId=null;
let syncApplying=false, syncBusy=false;
const DEFAULT_WORKER_URL='https://little-block-bb25.y9jmnytrgd.workers.dev';

const platforms=['Nintendo','Super Nintendo','Nintendo 64','Game Boy','Game Boy Color','Game Boy Advance','DS','3DS','NES','Wii','Wii U','PlayStation','PlayStation 2','PlayStation 3','PlayStation 4','PlayStation 5','PSP','Xbox','Xbox 360','Xbox One','Xbox Series','Mega Drive','Master System','Dreamcast','Saturn','PC','Autre'];

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(CONSOLE_STORE))d.createObjectStore(CONSOLE_STORE,{keyPath:'id'});};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function allGames(){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly');const q=t.objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function putGame(g, sync=true){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(g);t.oncomplete=async()=>{res();if(sync&&!syncApplying)syncPushGame(g).catch(()=>{})};t.onerror=()=>rej(t.error)})}
async function deleteGame(id, sync=true){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=async()=>{res();if(sync&&!syncApplying)syncPushGame({id,deleted:true,updatedAt:new Date().toISOString()}).catch(()=>{})};t.onerror=()=>rej(t.error)})}
function allConsoles(){return new Promise((res,rej)=>{const t=db.transaction(CONSOLE_STORE,'readonly');const q=t.objectStore(CONSOLE_STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function putConsole(c){return new Promise((res,rej)=>{const t=db.transaction(CONSOLE_STORE,'readwrite');t.objectStore(CONSOLE_STORE).put(c);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function deleteConsole(id){return new Promise((res,rej)=>{const t=db.transaction(CONSOLE_STORE,'readwrite');t.objectStore(CONSOLE_STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function euro(v){return Number.isFinite(Number(v))?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(v)):'Prix inconnu'}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function syncCode(){return (localStorage.getItem('retro_sync_code')||'').trim()}
function getWorkerUrl(){return (localStorage.getItem('retro_api_url')||DEFAULT_WORKER_URL).replace(/\/$/,'')}
function authToken(){return sessionStorage.getItem('retro_auth_token')||''}
function authHeaders(extra={}){const h={'Content-Type':'application/json',...extra};const t=authToken();if(t)h.Authorization='Bearer '+t;return h}
function showLogin(message=''){const s=$('#loginScreen');if(!s)return;s.hidden=false;document.body.classList.add('locked');if(message){const o=$('#loginStatus');if(o)o.textContent=message;}setTimeout(()=>$('#loginUser')?.focus(),50)}
function hideLogin(){const s=$('#loginScreen');if(s)s.hidden=true;document.body.classList.remove('locked')}
async function doLogin(e){e.preventDefault();const user=$('#loginUser')?.value.trim();const pass=$('#loginPass')?.value||'';const out=$('#loginStatus');if(out)out.textContent='Connexion…';try{const r=await fetch(getWorkerUrl(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:user,password:pass})});const raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{}if(!r.ok||!data.token)throw new Error(data.error||'Identifiant ou mot de passe incorrect.');sessionStorage.setItem('retro_auth_token',data.token);if(out)out.textContent='';hideLogin();await startApp()}catch(err){if(out)out.textContent=err.message||'Connexion impossible.'}}
async function logout(){try{await fetch(getWorkerUrl(),{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'logout'})})}catch(e){}sessionStorage.removeItem('retro_auth_token');location.reload()}
async function authFetch(url,options={}){const opts={...options,headers:authHeaders(options.headers||{})};const r=await fetch(url,opts);if(r.status===401){sessionStorage.removeItem('retro_auth_token');showLogin('Session expirée. Connecte-toi à nouveau.');throw new Error('Session expirée.')}return r}

function makeSyncCode(){const a=new Uint8Array(10);crypto.getRandomValues(a);return 'RETRO-'+Array.from(a).map(x=>x.toString(36).padStart(2,'0')).join('').toUpperCase().slice(0,16)}
function ensureSyncCode(){let code=syncCode();if(!code){code=makeSyncCode();localStorage.setItem('retro_sync_code',code)}return code}
async function makeSyncSafeGame(game){
  const safe={...game};
  if(typeof safe.image==='string' && safe.image.length>180000){
    try{
      safe.image=await compressDataUrl(safe.image,700,.58);
    }catch(e){
      delete safe.image;
    }
  }
  return safe;
}
function compressDataUrl(dataUrl,maxSize=700,quality=.58){return new Promise((res,rej)=>{
  if(typeof dataUrl!=='string'||!dataUrl.startsWith('data:image/')) return res(dataUrl);
  const img=new Image();
  img.onload=()=>{
    const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*scale));
    c.height=Math.max(1,Math.round(img.height*scale));
    const ctx=c.getContext('2d');
    if(!ctx)return rej(new Error('Compression image impossible'));
    ctx.drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',quality));
  };
  img.onerror=()=>rej(new Error('Image invalide'));
  img.src=dataUrl;
});}
async function syncPushGame(game){
  const code=syncCode(),url=getWorkerUrl();
  if(!code||!url||!game?.id)return false;
  if(syncBusy&&syncApplying)return false;
  const safeGame=await makeSyncSafeGame(game);
  let lastError='Erreur inconnue';
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const r=await fetch(url,{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'sync_push',collectionId:code,game:safeGame})});
      const raw=await r.text();
      let data={};try{data=raw?JSON.parse(raw):{}}catch{}
      if(r.ok&&data.ok!==false)return true;
      lastError=data.error||`Erreur serveur HTTP ${r.status}`;
      if(attempt<3)await new Promise(res=>setTimeout(res,400*attempt));
    }catch(e){
      lastError=e?.message||'Erreur réseau';
      if(attempt<3)await new Promise(res=>setTimeout(res,400*attempt));
    }
  }
  throw new Error(lastError);
}
async function syncPullGames(showToast=false){const code=syncCode(),url=getWorkerUrl();if(!code||!url||syncBusy)return;syncBusy=true;try{const since=localStorage.getItem('retro_sync_last_pull')||'1970-01-01T00:00:00.000Z';const r=await fetch(url,{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'sync_pull',collectionId:code,since})});const raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{}if(!r.ok)throw new Error(data.error||`Erreur serveur HTTP ${r.status}`);syncApplying=true;for(const g of (data.games||[])){if(g.deleted){await deleteGame(g.id,false)}else{const clean={...g};delete clean._syncUpdatedAt;await putGame(clean,false)}}syncApplying=false;localStorage.setItem('retro_sync_last_pull',data.serverTime||new Date().toISOString());if(data.games?.length)await refresh();if(showToast)toast(data.games?.length?`🔄 ${data.games.length} jeu(x) récupéré(s)`:'☁️ Collection déjà à jour')}catch(e){syncApplying=false;if(showToast)toast('Synchronisation impossible : '+e.message)}finally{syncBusy=false}}
async function syncNow(){
  const code=syncCode(),url=getWorkerUrl();
  if(!code){toast('Crée ou indique d’abord ton code de synchronisation.');return}
  if(!url){toast('URL du serveur absente.');return}
  if(syncBusy){toast('Synchronisation déjà en cours…');return}
  syncBusy=true; let ok=0,failed=[];
  try{
    const all=await allGames(); const safe=[];
    for(const g of all){try{safe.push(await makeSyncSafeGame(g))}catch(e){failed.push({id:g.id,title:g.title||'',error:e?.message||'Préparation impossible'})}}
    for(let i=0;i<safe.length;i+=10){
      const batch=safe.slice(i,i+10); let sent=false,lastErr='Erreur inconnue';
      for(let attempt=1;attempt<=5&&!sent;attempt++){
        try{
          const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({action:'sync_push_batch',collectionId:code,games:batch})});
          const raw=await r.text(); let data={}; try{data=raw?JSON.parse(raw):{}}catch{}
          if(r.status===401){await handleAuthFailure(); throw new Error('Session expirée. Reconnecte-toi.')}
          if(!r.ok)throw new Error(data.error||`Erreur serveur HTTP ${r.status}`);
          for(const x of (data.failed||[])){const g=batch.find(z=>String(z.id)===String(x.id));failed.push({id:x.id,title:g?.title||'',error:x.error||'Erreur serveur'})}
          ok+=Number(data.success)||0; sent=true;
        }catch(e){lastErr=e?.message||'Erreur réseau';if(attempt<5)await new Promise(res=>setTimeout(res,800*attempt))}
      }
      if(!sent)for(const g of batch)failed.push({id:g.id,title:g.title||'',error:lastErr});
    }
    syncBusy=false; await syncPullGames(false);
    if(failed.length){localStorage.setItem('retro_sync_last_errors',JSON.stringify(failed.slice(0,100)));toast(`☁️ ${ok} synchronisés · ${failed.length} en échec`)}
    else{localStorage.removeItem('retro_sync_last_errors');toast(`☁️ ${ok} jeu(x) synchronisé(s)`)}
  }catch(e){syncBusy=false;toast('Synchronisation impossible : '+e.message)}
}

  <main class="collectionMain">
   <div class="collectionHeading"><div><h1>MA COLLECTION</h1><p>Chaque jeu a son histoire. Collectionne-les tous. 🎮</p></div><button class="collectionAdd" onclick="openAdd()">＋ Ajouter un jeu</button></div>
   <div class="arcadeFilters"><select id="platformFilter"><option>Tous les consoles</option><option>Tous</option>${platforms.map(x=>`<option ${p===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select><select id="conditionFilter"><option value="Tous" ${c==='Tous'?'selected':''}>Tous les états</option>${conditions.map(x=>`<option value="${escapeHtml(x)}" ${c===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select><input class="wide" id="collectionSearch" placeholder="Rechercher dans ma collection…" value="${escapeHtml(q)}"></div>

function openGameSheet(id){
  selectedGameId=id;
  const g=games.find(x=>x.id===id);
  if(!g)return;
  if(window.matchMedia('(max-width:650px)').matches){
    $('#viewModal').innerHTML=`<div class="gameSheet"><button class="gameSheetClose" onclick="viewDialog.close()">×</button>${detailPanel(g)}<div class="viewHint">Appuie sur × pour revenir à ta collection.</div></div>`;

  }else{
    render();
    document.querySelector('.detailPanel')?.scrollIntoView({behavior:'smooth',block:'start'});
  }

 const p=window._p||'Tous', c=window._c||'Tous';
 let list=games.filter(g=>(!q||`${g.title} ${g.platform} ${g.edition}`.toLowerCase().includes(q))&&(p==='Tous'||g.platform===p)&&(c==='Tous'||g.condition===c));

 if(top && top.value!==window._q) top.value=window._q||'';

tton class="danger" onclick="removeConsole()">🗑️ Supprimer</button>':''}</div></div>`;gameDialog.showModal()}
async function saveConsoleEditor(){const old=editingConsoleId?consoles.find(x=>x.id===editingConsoleId):null;const file=$('#cImageFile')?.files?.[0];if(file) pendingConsoleImage=await resizeImage(file);const c={id:editingConsoleId||crypto.randomUUID(),image:pendingConsoleImage||old?.image||'',name:$('#cName').value.trim(),model:$('#cModel').value.trim(),edition:$('#cEdition').value.trim(),year:$('#cYear').value||'',condition:$('#cCondition').value,quantity:Math.max(1,Number($('#cQty').value)||1),price:$('#cPrice').value===''?'':Number($('#cPrice').value),priceDate:$('#cPriceDate').value,notes:$('#cNotes').value.trim(),updatedAt:new Date().toISOString()};await putConsole(c);pendingConsoleImage='';gameDialog.close();await refresh();toast('Console enregistrée')}

function backupHTML(){return `<div class="app">${header()}<div class="sectionTitle">Sauvegarde</div><section class="hero"><h2 style="margin-top:0">Tes données restent locales</h2><p class="hint">Exporte régulièrement ta collection. Le fichier JSON contient aussi les photos enregistrées dans l'application.</p><div class="actions"><button class="ok" onclick="exportData()">📤 Exporter</button><button onclick="$('#importInput').click()">📥 Importer</button></div><p class="hint" style="margin-top:14px">L'import peut remplacer les données actuelles : une confirmation sera demandée.</p></section></div>`}
function settingsHTML(){const api=localStorage.getItem('retro_api_url')||DEFAULT_WORKER_URL;const code=syncCode()||ensureSyncCode();return `<div class="app">${header()}<div class="sectionTitle">Réglages</div><section class="hero"><h2 style="margin-top:0">IA de reconnaissance</h2><p class="hint">L'URL ci-dessous sera appelée uniquement lorsque tu demandes une reconnaissance. La clé OpenAI n'est jamais stockée ici.</p><div class="field"><label>URL de ton serveur sécurisé</label><input id="apiUrl" value="${escapeHtml(api)}" placeholder="https://ton-worker.workers.dev"></div><div class="actions"><button class="ok" onclick="saveSettings()">Enregistrer</button><button onclick="testWorker()">🔌 Tester la connexion</button></div><p id="workerStatus" class="hint"></p></section><section class="hero street"><h2 style="margin-top:0">☁️ Synchronisation téléphone ↔ PC</h2><p class="hint">Utilise le même code sur ton téléphone et ton PC. Le code est masqué à l'écran et reste enregistré localement.</p><div class="field"><label>Code de synchronisation</label><div style="display:flex;gap:8px;align-items:stretch;min-width:0"><input id="syncCode" type="password" value="${escapeHtml(code)}" autocomplete="off" autocapitalize="characters" spellcheck="false" style="flex:1;min-width:0"><button type="button" onclick="toggleSyncCode()" aria-label="Afficher ou masquer le code" title="Afficher ou masquer">👁️</button></div></div><div class="actions"><button class="ok" onclick="saveSyncSettings()">💾 Enregistrer le code</button><button onclick="syncNow()">🔄 Synchroniser maintenant</button><button onclick="copySyncCode()">📋 Copier le code</button></div><p class="hint">🔒 Le code reste masqué. Tu peux l'afficher temporairement avec 👁️ ou le copier directement.</p></section><section class="hero"><h2 style="margin-top:0">Sécurité</h2><p class="hint">Ton identifiant et ton mot de passe sont vérifiés par le Worker. La clé OpenAI reste côté serveur.</p><div class="actions"><button onclick="logout()">🔒 Se déconnecter</button></div></section></div>`}

function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function normText(v=''){return String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function editionsCompatible(a,b){
 const x=normText(a),y=normText(b);
 if(!x||!y)return true;
 if(x===y)return true;
 const region=['pal','ntsc','japan','japon','usa','us','europe','eu','fr','france'];
 for(const r of region){if(x.includes(r)!==y.includes(r))return false}
 return x.includes(y)||y.includes(x);
}
function findDuplicateGame(data){
 const title=normText(data.title), platform=normText(data.platform);
 if(!title)return null;
 return games.find(g=>{
   const gt=normText(g.title), gp=normText(g.platform);
   return gt===title && gp===platform && editionsCompatible(g.edition,data.edition);
 })||null;
}
function showDuplicateChoice(existing,data){
 const d=$('#duplicateDialog'),m=$('#duplicateModal');
 m.innerHTML=`<div class="duplicateHero"><div style="font-size:28px">⚠️</div><h2 style="margin:4px 0 8px">Jeu déjà présent</h2><p>Cette photo ressemble à un jeu que tu possèdes déjà :</p><p><strong>${escapeHtml(existing.title)}</strong><br>${escapeHtml(existing.platform)}${existing.edition?' · '+escapeHtml(existing.edition):''}<br>Exemplaires actuels : <strong>${existing.quantity||1}</strong></p></div>
 <div class="duplicateChoices">
 <button onclick="duplicateAddCopy('${existing.id}')">➕ Ajouter un exemplaire</button>
 <button onclick="duplicateEdit('${existing.id}')">✏️ Voir / modifier l'existant</button>
 <button onclick="duplicateForceAdd()">➕ Ajouter quand même comme nouveau jeu</button>
 <button onclick="$('#duplicateDialog').close()">❌ Annuler</button></div>`;
 window._duplicateData={...data,image:pendingImage};
 d.showModal();
}
async function duplicateAddCopy(id){
 const g=games.find(x=>x.id===id); if(!g)return;
 g.quantity=Math.max(1,Number(g.quantity)||1)+1;g.updatedAt=new Date().toISOString();
 await putGame(g);$('#duplicateDialog').close();photoDialog.close();await refresh();toast('Exemplaire ajouté à la collection');
}
function duplicateEdit(id){$('#duplicateDialog').close();photoDialog.close();const g=games.find(x=>x.id===id);if(g)openEditor(g)}
function duplicateForceAdd(){const d=window._duplicateData||{};$('#duplicateDialog').close();photoDialog.close();openEditor(d)}
async function recognizePhoto(){
 const url=localStorage.getItem('retro_api_url');if(!url){toast('Configure d’abord l’URL du serveur dans Réglages.');return}
 const wrap=$('#photoPreviewWrap');wrap.insertAdjacentHTML('beforeend','<p id="loading" class="hint"><span class="loader"></span> Analyse en cours…</p>');
 try{
   const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);
   const r=await fetch(url,{method:'POST',headers:authHeaders(),body:JSON.stringify({image:pendingImage}),signal:controller.signal});
   clearTimeout(timer);
   const raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{};}catch{}
   if(!r.ok)throw new Error(data.error||`Erreur serveur HTTP ${r.status}`);
   if(!data.title&&!data.platform)throw new Error('Le serveur a répondu sans identification.');
   const duplicate=findDuplicateGame(data);
   if(duplicate){$('#loading')?.remove();showDuplicateChoice(duplicate,data);return}
   photoDialog.close();openEditor({...data,image:pendingImage});
 }catch(e){
   $('#loading')?.remove();
   const msg=e.name==='AbortError'?'Le serveur met trop de temps à répondre.':e.message;
   wrap.insertAdjacentHTML('beforeend',`<p class="hint" style="color:#fecaca">❌ ${escapeHtml(msg)}</p>`);toast('Reconnaissance impossible');
 }
}
function openEditor(g={}){
 editingId=g.id||null; window._pendingEstimate=g.estimate||null;
 const d=$('#gameDialog');$('#gameModal').innerHTML=`<h2>${editingId?'Modifier le jeu':'Vérifier le jeu'}</h2>
 <img class="preview" src="${g.image||''}" ${g.image?'':'style="display:none"'}>
 <div class="field"><label>Titre</label><input id="fTitle" value="${escapeHtml(g.title||'')}"></div>
 <div class="row"><div class="field"><label>Console / plateforme</label><input id="fPlatform" list="platformsList" value="${escapeHtml(g.platform||'')}"><datalist id="platformsList">${platforms.map(x=>`<option>${escapeHtml(x)}</option>`).join('')}</datalist></div>
 <div class="field"><label>Année</label><input id="fYear" type="number" value="${g.year||''}"></div></div>
 <div class="field"><label>Édition / version</label><input id="fEdition" value="${escapeHtml(g.edition||'')}"></div>
 <div class="field"><label>État</label><select id="fCondition">${conditions.map(x=>`<option ${g.condition===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
 <div class="row"><div class="field"><label>Quantité</label><input id="fQty" type="number" min="1" value="${g.quantity||1}"></div><div class="field"><label>Prix personnel (€)</label><input id="fPrice" type="number" min="0" step="0.01" value="${g.price??''}"></div></div>${g.estimate?.typical!=null?`<div class="estimateBox"><div class="estimateTitle">🤖 Estimation automatique</div><div class="estimateMain">${euro(g.estimate.typical)}</div><div class="estimateRange">${euro(g.estimate.low)} – ${euro(g.estimate.high)} · ${g.estimate.count||0} prix analysés</div></div>`:''}
 <div class="field"><label>Date de l'estimation</label><input id="fPriceDate" type="date" value="${g.priceDate||''}"></div>
 <div class="field"><label>Notes</label><textarea id="fNotes">${escapeHtml(g.notes||'')}</textarea></div>
 <p class="hint">Confiance IA : ${escapeHtml(g.confidence||'non indiquée')}. Corrige librement les informations avant d'enregistrer.</p>
 <div class="actions"><button onclick="gameDialog.close()">Annuler</button>${g.title?`<button class="marketBtn vinted" onclick="window.open(vintedUrlFromForm(), '_blank')"><span class="marketIcon">V</span><span><span class="marketLabel">Vinted</span><span class="marketHint">Voir les annonces</span></span></button>`:''}${g.title?`<button class="marketBtn ebay" onclick="window.open(ebayUrlFromForm(), '_blank')"><span class="marketIcon">e</span><span><span class="marketLabel">eBay</span><span class="marketHint">Voir les annonces</span></span></button>`:''}<button onclick="estimateEditingGame()">🤖 Estimer la valeur</button><button class="ok" onclick="saveEditor()">💾 Enregistrer</button>${editingId?'<button class="danger" onclick="removeEditing()">🗑️ Supprimer</button>':''}</div>`;
 d.showModal();
}
const gameDialog=$('#gameDialog');
async function saveEditor(){const old=editingId?games.find(x=>x.id===editingId):null;const g={id:editingId||crypto.randomUUID(),image:old?.image||pendingImage,title:$('#fTitle').value.trim(),platform:$('#fPlatform').value.trim(),year:$('#fYear').value||'',edition:$('#fEdition').value.trim(),condition:$('#fCondition').value,quantity:Math.max(1,Number($('#fQty').value)||1),price:$('#fPrice').value===''?'':Number($('#fPrice').value),priceDate:$('#fPriceDate').value,notes:$('#fNotes').value.trim(),estimate:window._pendingEstimate||old?.estimate||null,updatedAt:new Date().toISOString()};await putGame(g);gameDialog.close();pendingImage='';window._pendingEstimate=null;await refresh();toast('Jeu enregistré')}
async function editGame(id){const g=games.find(x=>x.id===id);if(g)openEditor(g)}
async function estimateEditingGame(){
 const g={id:editingId,title:$('#fTitle')?.value.trim(),platform:$('#fPlatform')?.value.trim(),year:$('#fYear')?.value||'',edition:$('#fEdition')?.value.trim(),condition:$('#fCondition')?.value||''};
 if(!g.title){toast('Indique d’abord le titre du jeu.');return}
 await estimateGameData(g,true);
}
async function estimateGame(id){const g=games.find(x=>x.id===id);if(g)await estimateGameData(g,false)}
async function estimateGameData(g,fromEditor){
  const url=localStorage.getItem('retro_api_url');
  if(!url){toast('Configure d’abord l’URL du serveur dans Réglages.');return}
  toast('Recherche des prix en ligne…');
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),60000);
    const r=await fetch(url,{
      method:'POST',
      headers:authHeaders(),
      body:JSON.stringify({
        action:'estimate',
        game:{
          title:g.title,
          platform:g.platform,
          year:g.year,
          edition:g.edition,
          condition:g.condition
        }
      }),
      signal:controller.signal
    });
    clearTimeout(timer);

    const raw=await r.text();
    let data={};
    try{data=raw?JSON.parse(raw):{}}catch{}

    if(!r.ok)throw new Error(data.error||`Erreur serveur HTTP ${r.status}`);
    if(!Number.isFinite(Number(data.typical)))
      throw new Error('Aucune estimation exploitable n’a été trouvée.');

    const now=new Date();
    const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

    const est={
      low:Number(data.low),
      typical:Number(data.typical),
      high:Number(data.high),
      count:Number(data.count)||0,
      updatedAt:now.toISOString(),
      sources:Array.isArray(data.sources)?data.sources:[]
    };

    if(fromEditor){
      const old=editingId?games.find(x=>x.id===editingId):null;
      if(old)old.estimate=est;

      // La valeur estimée est automatiquement inscrite dans la case Prix.
      const priceInput=$('#fPrice');
      const dateInput=$('#fPriceDate');
      if(priceInput)priceInput.value=String(est.typical);
      if(dateInput)dateInput.value=today;

      // Évite d'afficher plusieurs blocs d'estimation si on relance une recherche.
      $('#gameModal .estimateBox')?.remove();

      $('#gameModal').insertAdjacentHTML('beforeend',
        `<div class="estimateBox">
          <div class="estimateTitle">🤖 Estimation automatique</div>
          <div class="estimateMain">${euro(est.typical)}</div>
          <div class="estimateRange">${euro(est.low)} – ${euro(est.high)} · ${est.count} prix analysés</div>
          <div class="hint">📅 Estimation du ${new Intl.DateTimeFormat('fr-FR').format(now)}</div>
        </div>`
      );

      window._pendingEstimate=est;
      toast('Valeur et date enregistrées dans la fiche');
    }else{
      const idx=games.findIndex(x=>x.id===g.id);
      if(idx>=0){
        games[idx].estimate=est;
        // La valeur estimée devient automatiquement le prix enregistré.
        games[idx].price=Number(est.typical);
        games[idx].priceDate=today;

        await putGame(games[idx]);
        await refresh();
        toast('Valeur et date enregistrées');
      }
    }
  }catch(e){
    toast(e.name==='AbortError'
      ?'La recherche prend trop de temps.'
      :('Estimation impossible : '+e.message));
  }
}
async function removeEditing(){if(!editingId)return;if(confirm('Supprimer définitivement ce jeu ?')){await deleteGame(editingId);gameDialog.close();await refresh();toast('Jeu supprimé')}}
function vintedSearchText(g){
 const parts=[g?.title,g?.platform,g?.edition].map(x=>String(x||'').trim().replace(/\s+/g,' ')).filter(Boolean);
 const seen=new Set();
 return parts.filter(x=>{const k=x.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).join(' ').slice(0,180);
}
function vintedUrl(g){
 const u=new URL('https://www.vinted.fr/catalog');
 const q=vintedSearchText(g);
 if(q)u.searchParams.set('search_text',q);
 return u.toString();
}
function openVinted(id){
 const g=games.find(x=>String(x.id)===String(id));
 if(!g)return;
 const url=vintedUrl(g);
 try{ window.location.assign(url); }catch(e){ window.location.href=url; }
}
function vintedUrlFromForm(){return vintedUrl({title:$('#fTitle')?.value||'',platform:$('#fPlatform')?.value||'',edition:$('#fEdition')?.value||''})}
function ebayUrl(g){return 'https://www.ebay.fr/sch/i.html?_nkw='+encodeURIComponent([g.title,g.platform,g.edition].filter(Boolean).join(' '))}
function ebayUrlFromForm(){return ebayUrl({title:$('#fTitle')?.value||'',platform:$('#fPlatform')?.value||'',edition:$('#fEdition')?.value||''})}
function exportData(){const payload={app:'Retro Collection',version:2,exportedAt:new Date().toISOString(),games,consoles};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='retro-collection-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.games))throw new Error('Fichier invalide');if(!confirm('Remplacer la collection actuelle par cette sauvegarde ?'))return;for(const g of games)await deleteGame(g.id);for(const g of data.games)await putGame(g);for(const c of consoles)await deleteConsole(c.id);for(const c of (data.consoles||[]))await putConsole(c);await refresh();toast('Sauvegarde importée')}catch(err){toast('Import impossible : '+err.message)}e.target.value=''}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ebay]');if(a){e.preventDefault();const g=games.find(x=>x.id===a.dataset.ebay);if(g)location.href=ebayUrl(g)}});

for(let i=0;i<18;i++){const sp=document.createElement('i');sp.className='spark';sp.style.left=(Math.random()*100)+'vw';sp.style.animationDuration=(6+Math.random()*8)+'s';sp.style.animationDelay=(-Math.random()*10)+'s';document.body.appendChild(sp)}
window.addEventListener('focus',()=>{if(syncCode())syncPullGames(false)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncCode())syncPullGames(false)});
setInterval(()=>{if(document.visibilityState==='visible'&&syncCode())syncPullGames(false)},60000);
async function startApp(){await openDB();nav();ensureSyncCode();await refresh();if(syncCode())await syncPullGames(false);if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
(async()=>{if(authToken()){try{await startApp()}catch(e){sessionStorage.removeItem('retro_auth_token');showLogin('Connexion requise.')}}else{showLogin('')}})();
</script>
